            el("p", { class: "need", text: "보관함이 가득 찼습니다(" + limit + "개). 가장 오래된 녹음(" + new Date(old.created_at).toLocaleString("ko-KR") + ", " + (os ? os.title : old.song_id + "번 곡") + ")을 지우고 저장할까요?" }),
            el("div", { class: "row-actions" }, [yes, no])]));

    }
    function cleanupRecording() {
      try { if (rec.recorder && rec.recorder.state === "recording") { rec.recorder.onstop = null; rec.recorder.stop(); } } catch (e) {}
      if (rec.stream) rec.stream.getTracks().forEach(tr => tr.stop());
      recAudio.pause();
      recordings.forEach(r => URL.revokeObjectURL(r.url));
    }

    /* ---------- 자막 싱크(교사용, 권한은 5단계) ---------- */
    function firstUnsynced() { const l = lyrics.find(x => typeof x.startTime !== "number"); return l ? l.lineNumber : null; }
    async function saveTimes(times, offset, undoEntry) {
      try {
        await Repo.setSync(id, times, offset);
        if (undoEntry) undoStack.push(undoEntry);
      } catch (e) { syncMsg.textContent = "저장하지 못했습니다: " + e.message; return false; }
      refreshTiming(); shownLine = undefined; drawSubtitle(true);
      if (repeat) { const r = repeat; repeat = null; const a = segment(r.fromLine), b = segment(r.toLine); if (a && b) repeat = Object.assign(r, { start: a.start, end: b.end }); drawPlayStatus(); }
      return true;
    }
    // 누른 순간의 재생 시간 T가 그 줄의 실제 시작이 되도록, 저장값 = T − 현재 보정값
    function rawFromNow() { return Math.max(0, player.getCurrentTime() - (Repo.getSong(id).syncOffset || 0)); }
    const syncMsg = el("p", { class: "small", role: "status" });
    const nextBtn = el("button", { type: "button", class: "primary big-btn", text: "다음 줄 시작" });
    // 누른 순간의 시간을 바로 잡고 다음 줄로 넘어간 뒤, 저장은 순서대로 뒤에서 한다(서버 왕복 중에 다시 눌러도 같은 줄을 덮어쓰지 않게).
    let syncQueue = Promise.resolve();
    nextBtn.addEventListener("click", () => {
      if (!ready || pointer === null) return;
      const n = pointer, l = lineByNo(n), lineId = l.lineId;
      const v = rawFromNow();
      const idx = indexOfLine(n);
      const prevTimed = lyrics.slice(0, idx).reverse().find(x => typeof x.startTime === "number");
      const undo = { times: { [lineId]: typeof l.startTime === "number" ? l.startTime : null }, pointer: n, label: n };
      pointer = idx + 1 < lyrics.length ? lyrics[idx + 1].lineNumber : null;
      syncMsg.textContent = n + "번 줄 = " + fmtClock(v + (Repo.getSong(id).syncOffset || 0)) + " 저장 중…";
      drawSyncPanel();
      syncQueue = syncQueue.then(async () => {
        const ok = await saveTimes({ [lineId]: v }, undefined, undo);
        if (!ok) { pointer = n; syncMsg.textContent = n + "번 줄을 저장하지 못했습니다. 다시 찍어 주세요."; }
        else syncMsg.textContent = n + "번 줄 = " + fmtClock(v + (Repo.getSong(id).syncOffset || 0)) +
          (prevTimed && prevTimed.startTime > v ? " (앞 줄보다 이른 시간입니다. 확인하세요)" : "");
        drawSyncPanel(); drawLyrics(); drawRange(); drawPractice();
      });
    });
    async function undoLast() {
      const u = undoStack.pop();
      if (!u) return;
      await syncQueue;
      if (await saveTimes(u.times)) {
        pointer = u.pointer;
        syncMsg.textContent = (u.label || Object.keys(u.times)[0]) + "번 줄을 되돌렸습니다.";
        drawSyncPanel(); drawLyrics(); drawRange(); drawPractice();
      }
    }
    async function retakeLine(n) {
      if (!ready) return;
      const l = lineByNo(n), v = rawFromNow();
      await syncQueue;
      if (await saveTimes({ [l.lineId]: v }, undefined, { times: { [l.lineId]: typeof l.startTime === "number" ? l.startTime : null }, pointer: pointer, label: n })) {
        syncMsg.textContent = n + "번 줄만 다시 찍었습니다: " + fmtClock(v + (Repo.getSong(id).syncOffset || 0));
        drawSyncPanel(); drawLyrics(); drawRange(); drawPractice();
      }
    }
    async function shiftOffset(delta) {
      const cur = Repo.getSong(id).syncOffset || 0;
      const next = Math.round((cur + delta) * 100) / 100;
      if (await saveTimes({}, next)) { syncMsg.textContent = "전체 보정 " + (next >= 0 ? "+" : "") + next.toFixed(1) + "초로 저장했습니다."; drawSyncPanel(); drawLyrics(); drawRange(); drawPractice(); }
    }
    function exportSync() {
      const s = Repo.getSong(id), times = {};
      lyrics.forEach(l => { if (typeof l.startTime === "number") times[l.lineId] = l.startTime; });
      const data = { app: APP_ID, kind: "song-sync", schemaVersion: 2, exportedAt: new Date().toISOString(),
        songId: id, title: s.title, artist: s.artist, lineCount: lyrics.length, syncOffset: s.syncOffset || 0, startTimes: times,
        lines: lyrics.map(l => ({ lineId: l.lineId, lineNumber: l.lineNumber, vietnamese: l.vietnamese })) };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const d = new Date(), p2 = n => String(n).padStart(2, "0");
      const name = "싱크_" + id + "번_" + s.title.replace(/[\\/:*?"<>|]/g, "") + "_" + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + ".json";
      const a = el("a", { href: URL.createObjectURL(blob), download: name });
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);

    }
    const syncImportArea = el("div");
    function onSyncFile(file) {
      const reader = new FileReader();
      reader.onload = () => {
        let o;
        try { o = JSON.parse(reader.result); } catch (e) { syncImportArea.replaceChildren(el("p", { class: "bad", text: "JSON 파일을 읽지 못했습니다." })); return; }
        const errs = [], dropped = [], byId = {};

        }
        if (errs.length) { syncImportArea.replaceChildren(el("ul", { class: "errors" }, errs.slice(0, 5).map(e => el("li", { text: e })))); return; }
        const n = Object.keys(byId).length;
        const go = el("button", { type: "button", class: "primary", text: "이 싱크로 바꾸기" });
        go.addEventListener("click", async () => {
          const times = {};
          lyrics.forEach(l => { times[l.lineId] = (l.lineId in byId) ? byId[l.lineId] : null; });
          if (await saveTimes(times, o.syncOffset)) {
            undoStack.length = 0; pointer = firstUnsynced();
            syncImportArea.replaceChildren(el("p", { class: "notice", text: "싱크를 가져왔습니다(" + n + "줄, 보정 " + o.syncOffset.toFixed(1) + "초)." }));

          o.title !== Repo.getSong(id).title ? el("p", { class: "need", text: "곡명이 지금 곡과 다릅니다. 확인하세요." }) : null,

    function drawSyncPanel() {

      fill(syncPanel,
        el("h3", { text: "자막 싱크 (교사용)" }),
        el("p", { class: "small muted", text: "영상을 재생하면서 가사가 시작되는 순간 [다음 줄 시작]을 누르세요. 찍은 줄 " + done + "/" + lyrics.length }),
        syncClock,

      let saved = false;
      function saveDuration(p) {

        // (사용자가 유튜브에서 자막을 켜 둔 경우나 영상 소유자 설정에 따라 보일 수 있음 → 화면 안내).

          onStateChange: e => {

            if (e.data === YT.PlayerState.PLAYING) Diag.record(song.id, { result: "재생됨", code: null });
          },
          onError: e => {
            const reason = YT_ERRORS[e.data] || ("유튜브 오류 " + e.data);

    }).catch(err => {

  /* =========================================================
   * 7. 곡 추가
   *    붙여넣기 형식: 절 [탭] 줄 번호 [탭] 베트남어 원문 [탭] 한국어 번역 ([탭] 번역 상태 — 선택)
   * ========================================================= */
  function parseClipboardTable(text) {
    // 엑셀 복사본: 칸은 탭, 줄은 줄바꿈. 줄바꿈·탭·따옴표가 든 칸은 "..."로 감싸지고 " 는 ""로 바뀐다.
    const rows = [];
    const src = text.replace(/\r\n?/g, "\n");
    let i = 0, line = 1;
    while (i < src.length) {
      const startLine = line;
      const cells = [];
      let endOfRow = false;
      while (!endOfRow) {
        let cell = "";
        let quotedOk = false;
        if (src[i] === "\"") {
          // 엑셀식 따옴표 칸인지 시험: 닫는 따옴표 바로 뒤가 탭·줄바꿈·끝이어야 한다.
          let j = i + 1, buf = "", nl = 0, closed = false;
          while (j < src.length) {
            if (src[j] === "\"") {
              if (src[j + 1] === "\"") { buf += "\""; j += 2; continue; }
              closed = true; j++; break;
            }
            if (src[j] === "\n") nl++;
            buf += src[j++];
          }
          if (closed && (j >= src.length || src[j] === "\t" || src[j] === "\n")) {
            cell = buf; i = j; line += nl; quotedOk = true;
          }
        }
        if (!quotedOk) {
          // 따옴표로 감싼 칸이 아니면 글자를 그대로 둔다(예: "Ba năm mươi" bổ đôi …).
          while (i < src.length && src[i] !== "\t" && src[i] !== "\n") cell += src[i++];
        }
        cells.push(cell);
        if (i >= src.length) endOfRow = true;
        else if (src[i] === "\t") i++;
        else { i++; line++; endOfRow = true; }
      }
      rows.push({ line: startLine, cells: cells });
    }
    return rows;
  }

  function parseLyrics(text) {
    const out = { rows: [], errors: [], warnings: [] };
    if (!text || !text.trim()) return out;
    let raw = parseClipboardTable(text).filter(r => r.cells.some(c => c.trim() !== ""));
    if (raw.length && raw[0].cells[0].trim() === "절") {
      out.warnings.push("붙여넣은 " + raw[0].line + "번째 줄은 머리글(절, 줄 번호 …)이라 건너뛰었습니다.");
      raw = raw.slice(1);
    }
    const seen = new Map();
    raw.forEach(r => {
      const where = "붙여넣은 " + r.line + "번째 줄";
      let cells = r.cells.slice();
      while (cells.length > 3 && cells[cells.length - 1] === "") cells.pop(); // 끝의 빈 칸
      if (cells.length === 1) { out.errors.push(where + ": 탭으로 나뉘어 있지 않습니다. 엑셀에서 '절'부터 '한국어 번역'까지 칸을 복사해 붙여넣으세요."); return; }
      if (cells.length < 3) { out.errors.push(where + ": 칸이 " + cells.length + "개입니다. 절, 줄 번호, 베트남어 원문, 한국어 번역 4칸이 필요합니다."); return; }
      if (cells.length > 5) { out.errors.push(where + ": 칸이 " + cells.length + "개입니다. '곡 ID'·'곡명' 칸은 빼고 '절'부터 복사하세요."); return; }
      const [vRaw, nRaw, vi, koRaw, stRaw] = cells;
      const errs = [];
      if (!/^\d+$/.test(vRaw.trim()) || Number(vRaw.trim()) < 1) errs.push("절 '" + vRaw + "'이(가) 1 이상의 숫자가 아닙니다");
      if (!/^\d+$/.test(nRaw.trim()) || Number(nRaw.trim()) < 1) errs.push("줄 번호 '" + nRaw + "'이(가) 1 이상의 숫자가 아닙니다");
      if (!vi || vi.trim() === "") errs.push("베트남어 원문이 비었습니다");
      const ko = koRaw === undefined ? "" : koRaw;
      const hasKo = ko.trim() !== "";
      let status = null;
      if (stRaw !== undefined && stRaw.trim() !== "") {
        if (!TRANSLATION_STATUSES.includes(stRaw.trim())) errs.push("번역 상태 '" + stRaw + "'은(는) 'AI 번역' 또는 '검수 완료'여야 합니다");
        else status = stRaw.trim();
      }
      if (errs.length) { out.errors.push(where + ": " + errs.join(", ") + "."); return; }
      const lineNumber = Number(nRaw.trim());
      if (seen.has(lineNumber)) { out.errors.push(where + ": 줄 번호 " + lineNumber + "이(가) 붙여넣은 " + seen.get(lineNumber) + "번째 줄과 겹칩니다."); return; }
      seen.set(lineNumber, r.line);
      out.rows.push({ verse: Number(vRaw.trim()), lineNumber: lineNumber, vietnamese: vi, korean: hasKo ? ko : "",
                      translationStatus: hasKo ? status : null, statusFromPaste: status !== null, srcLine: r.line });
    });
    out.rows.sort((a, b) => a.lineNumber - b.lineNumber);
    out.rows.forEach((r, idx) => {
      if (r.lineNumber !== idx + 1 && !out.warnings.some(w => w.startsWith("줄 번호가")))
        out.warnings.push("줄 번호가 1부터 빠짐없이 이어지지 않습니다(" + (idx + 1) + "번이 없음). 저장은 됩니다.");
      if (idx > 0 && r.verse < out.rows[idx - 1].verse && !out.warnings.some(w => w.startsWith("절 번호")))
        out.warnings.push("절 번호가 줄 번호 순서에서 줄어드는 곳이 있습니다(줄 " + r.lineNumber + "). 저장은 됩니다.");
    });
    const noKo = out.rows.filter(r => !r.korean).length;
    if (noKo) out.warnings.push("번역이 빈 줄 " + noKo + "개는 '번역 입력 필요'로 표시됩니다.");
    return out;
  }

  /* 간단 입력: 원문 칸과 번역 칸을 같은 줄끼리 짝짓는다.
   * - 원문 칸의 빈 줄 = 절이 바뀜(연속 빈 줄은 한 번), 줄 번호는 자동.
   * - 번역 칸의 빈 줄 = 그 줄 번역 없음("번역 입력 필요"). 번역 칸을 통째로 비워도 된다.
   * - 두 칸은 같은 줄 위치끼리 짝이므로, 원문 빈 줄(절 구분) 자리에는 번역도 빈 줄이어야 한다. */
  function parseSimpleLyrics(viText, koText) {
    const out = { rows: [], errors: [], warnings: [] };
    const blank = s => s === undefined || s.trim() === "";
    const vi = (viText || "").replace(/\r\n?/g, "\n").split("\n");
    const ko = (koText || "").replace(/\r\n?/g, "\n").split("\n");
    let last = vi.length - 1;
    while (last >= 0 && blank(vi[last])) last--;
    if (last < 0) {
      if (ko.some(s => !blank(s))) out.errors.push("번역 칸에만 글이 있습니다. 베트남어 원문 칸을 채워 주세요.");
      return out;
    }
    const koEmpty = ko.every(blank);
    const short = s => (s.length > 24 ? s.slice(0, 24) + "…" : s);
    let verse = 1, sawLine = false, breakPending = false;
    for (let i = 0; i <= last; i++) {
      if (blank(vi[i])) {
        if (sawLine) breakPending = true;
        if (!koEmpty && !blank(ko[i])) {
          out.errors.push("원문 칸 " + (i + 1) + "번째 줄은 빈 줄(절 구분)인데, 번역 칸 " + (i + 1) + "번째 줄에는 '" + short(ko[i]) + "'이(가) 있습니다. 이 근처에서 두 칸의 줄이 어긋났습니다.");
        }
        continue;
      }
      if (breakPending) { verse++; breakPending = false; }
      sawLine = true;
      const k = koEmpty ? "" : (ko[i] === undefined ? "" : ko[i]);
      out.rows.push({ verse: verse, lineNumber: out.rows.length + 1, vietnamese: vi[i], korean: blank(k) ? "" : k,
                      translationStatus: null, srcLine: i + 1 });
    }
    if (!koEmpty) {
      let koLast = ko.length - 1;
      while (koLast >= 0 && blank(ko[koLast])) koLast--;
      if (koLast > last) {
        out.errors.push("번역 칸이 원문 칸보다 깁니다. 번역 칸 " + (last + 2) + "번째 줄부터 짝이 되는 원문이 없습니다(예: '" + short(ko[koLast]) + "').");
      } else if (ko.length - 1 < last) {
        const firstMissing = out.rows.find(r => r.srcLine > ko.length);
        out.errors.push("번역 칸이 원문 칸보다 " + (last + 1 - ko.length) + "줄 짧습니다. 원문 칸 " + (ko.length + 1) + "번째 줄" +
          (firstMissing ? "('" + short(firstMissing.vietnamese) + "')" : "") + "부터 짝이 되는 번역 줄이 없습니다. 번역하지 않을 줄은 번역 칸에 빈 줄로 남겨 두세요.");
      }
    }
    const noKo = out.rows.filter(r => !r.korean).length;
    if (koEmpty) out.warnings.push("번역 칸이 비어 있어 모든 줄이 '번역 입력 필요'로 표시됩니다.");
    else if (noKo) out.warnings.push("번역이 빈 줄 " + noKo + "개는 '번역 입력 필요'로 표시됩니다.");
    return out;
  }

    const panelSimple = el("div", { role: "tabpanel", id: "panel-simple", "aria-labelledby": "tab-simple" }, [
      el("p", { class: "hint", text: "한 줄에 가사 한 줄씩 적습니다. 원문 칸에 빈 줄을 넣으면 다음 절로 넘어가고, 줄 번호는 자동으로 매깁니다. 번역 칸은 원문과 같은 줄 위치에 적고, 번역하지 않을 줄은 비워 둡니다." }),

    ]);
    const panelExcel = el("div", { role: "tabpanel", id: "panel-excel", "aria-labelledby": "tab-excel" }, [
      el("p", { class: "hint", text: "엑셀 '가사' 시트에서 '절'·'줄 번호'·'베트남어 원문'·'한국어 번역' 네 칸을 함께 복사해 그대로 붙여넣으세요. '번역 상태' 칸까지 복사해도 됩니다." }),

    ]);

    }

    function currentParse() {
      return mode === "simple" ? parseSimpleLyrics(f.vi.value, f.ko.value) : parseLyrics(f.lyrics.value);
    }
    function isEmptyInput() {
      return mode === "simple" ? !f.vi.value.trim() && !f.ko.value.trim() : !f.lyrics.value.trim();
    }

    function drawPreview() {
      const res = currentParse();
      const nodes = [];
      if (isEmptyInput()) {
        nodes.push(el("p", { class: "hint", text: "가사를 넣으면 저장 전에 여기에서 표로 확인할 수 있습니다. 가사 없이 저장하면 '준비 중'이 됩니다." }));
      } else {

        if (res.errors.length) nodes.push(el("ul", { class: "errors" }, res.errors.map(e => el("li", { text: e }))));
        if (res.warnings.length) nodes.push(el("ul", { class: "warnings" }, res.warnings.map(e => el("li", { text: e }))));
        if (res.rows.length) {
          const body = res.rows.map(r => el("tr", null, [

            el("td", { class: "num", text: String(r.lineNumber) }),
            el("td", { lang: "vi", text: r.vietnamese }),

            el("td", { class: "small", text: r.korean ? (r.translationStatus || f.status.value) : "" })
          ]));

            el("tbody", null, body)
          ])]));
        }
      }
      preview.replaceChildren.apply(preview, nodes);
      return res;
    }
    let t = null;
    [f.lyrics, f.vi, f.ko].forEach(x => x.addEventListener("input", () => { clearTimeout(t); t = setTimeout(drawPreview, 250); }));
    f.status.addEventListener("change", drawPreview);
    // 입력을 고치면 지난 저장 시도의 오류 안내를 지운다.
    [f.title, f.artist, f.releaseDate, f.chartRank, f.videoUrl, f.lyrics, f.vi, f.ko].forEach(x =>
      x.addEventListener("input", () => { formErrors.replaceChildren(); }));

      const v = f.videoUrl.value.trim();
      const id = v ? youtubeId(v) : null;
      videoHint.textContent = !v ? "youtube.com/watch?v=…, youtu.be/…, ?si=가 붙은 공유 링크 모두 됩니다."
        : id ? "영상 ID " + id + " → " + canonicalVideoUrl(id) + " 로 저장합니다."
        : "유튜브 영상 주소로 인식하지 못했습니다.";
      videoHint.className = "hint" + (v && !id ? " bad" : "");
    });

    saveBtn.addEventListener("click", async () => {
      const errs = [];
      const title = f.title.value.trim(), artist = f.artist.value.trim();
      if (!title) errs.push("곡명을 입력하세요.");
      if (!artist) errs.push("가수를 입력하세요.");
      let rank = null;
      if (f.chartRank.value.trim() !== "") {
        if (!/^\d+$/.test(f.chartRank.value.trim()) || Number(f.chartRank.value) < 1) errs.push("차트 순위는 1 이상의 정수여야 합니다.");
        else rank = Number(f.chartRank.value.trim());
      }
      const url = f.videoUrl.value.trim();
      const vid = url ? youtubeId(url) : null;
      if (url && !vid) errs.push("영상 링크가 유튜브 영상 주소가 아닙니다(예: https://youtu.be/…).");
      const date = f.releaseDate.value || null;
      const res = drawPreview();
      if (res.errors.length) errs.push("가사 오류 " + res.errors.length + "개를 먼저 고쳐 주세요(미리보기 참고).");
      if (errs.length) {
        formErrors.replaceChildren(el("ul", { class: "errors" }, errs.map(e => el("li", { text: e }))));
        formErrors.scrollIntoView({ block: "center" });
        return;
      }
      const dup = Repo.getSongs().find(s => s.title.trim().toLowerCase() === title.toLowerCase() && s.artist.trim().toLowerCase() === artist.toLowerCase());
      if (dup && !saveBtn.dataset.confirmDup) {
        saveBtn.dataset.confirmDup = "1";
        saveBtn.textContent = "그래도 저장";
        formErrors.replaceChildren(el("ul", { class: "warnings" }, [el("li", { text: "같은 곡명·가수의 곡이 이미 있습니다(ID " + dup.id + "). 그래도 저장하려면 [그래도 저장]을 누르세요." })]));
        return;
      }
      const rows = res.rows.map(r => ({ verse: r.verse, lineNumber: r.lineNumber, vietnamese: r.vietnamese, korean: r.korean,
        translationStatus: r.korean ? (r.translationStatus || f.status.value) : null }));
      saveBtn.disabled = true;
      try {
        const target = targetOf();
        if (!target) { saveBtn.disabled = false; formErrors.replaceChildren(el("ul", { class: "errors" }, [el("li", { text: "곡을 넣을 반을 고르세요(반이 없으면 [반]에서 먼저 만드세요)." })])); return; }
        const song = await Repo.addSong({ title: title, artist: artist, chartRank: rank, releaseDate: date,
          videoUrl: vid ? canonicalVideoUrl(vid) : null }, rows, target);
        flash = { songId: song.id, message: song.id + "번 곡 '" + song.title + "'을(를) 추가했습니다" + (song.status === "ready" ? " (가사 " + rows.length + "줄)." : ". 가사가 없어 '준비 중'입니다.") };
        location.hash = "#/";
      } catch (e) {
        saveBtn.disabled = false;
        formErrors.replaceChildren(el("ul", { class: "errors" }, [el("li", { text: "저장하지 못했습니다: " + e.message })]));
      }
    });

    // 공개 범위는 역할로 정해진다: 학습자 = 나만, 승인된 교사 = 내 반, 관리자 = 전체 공개
    const myClasses = Repo.getClasses().filter(c => Repo.teaches(c.id) && !c.archived);
    const classSel = el("select", { id: "f-class" }, myClasses.map(c => el("option", { value: c.id, text: c.name })));
    function targetOf() {
      if (Server.isAdmin()) return { visibility: "public" };
      if (Server.isTeacher()) return classSel.value ? { visibility: "class", classId: classSel.value } : null;
      return { visibility: "private" };
    }
    const scopeInfo = Server.isAdmin() ? [el("p", { class: "notice", text: "관리자가 추가한 곡은 전체 공개(public)입니다." })]
      : Server.isTeacher() ? (myClasses.length ? [el("label", { for: "f-class", text: "곡을 넣을 반 (그 반 학생만 봅니다)" }), classSel]
                                               : [el("p", { class: "need", text: "반이 없습니다. [반]에서 반을 먼저 만드세요." })])
      : [el("p", { class: "notice", text: "학습자가 추가한 곡은 나만 볼 수 있습니다(private)." })];
    setView([
      el("h2", { text: "곡 추가" })].concat(scopeInfo, [
      el("p", { class: "muted small", text: "곡 번호는 저장할 때 서버가 정합니다." }),
      el("label", { for: "f-title", text: "곡명 (필수)" }), f.title,
      el("label", { for: "f-artist", text: "가수 (필수)" }), f.artist,
      el("label", { for: "f-date", text: "발행일" }), f.releaseDate,
      el("label", { for: "f-rank", text: "차트 순위" }), f.chartRank,
      el("label", { for: "f-video", text: "영상 링크 (유튜브)" }), f.videoUrl, videoHint,
      el("h3", { text: "가사 입력 방식" }),
      el("div", { class: "tabs", role: "tablist", "aria-label": "가사 입력 방식" }, [tabSimple, tabExcel]),
      panelSimple, panelExcel,
      el("label", { for: "f-status", text: "번역 상태 (번역이 있는 줄에 적용)" }), f.status,
      el("h3", { text: "미리보기" }), preview,
      formErrors,
      el("div", { class: "row-actions" }, [saveBtn, el("a", { class: "btn", href: "#/", text: "취소" })])
    ]), "add");
    window.scrollTo(0, 0);
    f.videoUrl.dispatchEvent(new Event("input"));
    setMode("simple");
  }

  /* =========================================================
   * 7-1. 설정 (어휘 수준·곡 단계)
   * ========================================================= */
  function renderSettings() {
    const tableBox = el("div");
    const numStatus = el("div", { role: "status" });

    function drawTable() {
      const an = Analysis.all();
      const rows = Array.from(an.bySong.values()).sort((a, b) => a.rank - b.rank || a.id - b.id);
      const body = rows.map(a => {
        const s = Repo.getSong(a.id);
        return el("tr", null, [
          el("td", { class: "num", text: String(a.id) }),
          el("td", { lang: "vi", text: s.title }),
          el("td", { class: "num", text: pctText(a.pct[3]) }),
          el("td", { class: "num", text: pctText(a.pct[4]) }),
          el("td", { class: "num", text: VocabEngine.roundScore(a.score).toFixed(1) }),
          el("td", { class: "num", text: a.rank + "/" + a.n }),
          el("td", null, [el("span", { class: "tag lv lv" + a.level, text: LEVEL_NAMES[a.level] })])
        ]);
      });
      fill(tableBox,
        el("p", { text: "지금 적용 중: 순위 사분위 — " + relativeNote(an.n) }),
        el("p", { class: "hint", text: "가사가 있는 곡 N곡을 어휘 점수 낮은 순으로 줄 세워 순위 r(1부터)을 매기고, 단계 = ⌊4 × (r − 1) ÷ N⌋ 로 정합니다(0 입문, 1 초급, 2 중급, 3 고급). 점수가 소수 첫째 자리까지 같으면 같은 순위(앞 순위)를 함께 받아 같은 단계가 됩니다. 곡이 적으면 결과가 불안정합니다." }),
        el("p", { class: "hint", text: "어휘 점수 = " + Settings.get().weights[0] + " × ★★★ 비율 + " + Settings.get().weights[1] + " × ★★★★ 비율(%)" }),
        el("div", { class: "table-wrap" }, [el("table", null, [
          el("thead", null, [el("tr", null, ["ID", "곡명", "★★★", "★★★★", "점수", "순위", "단계"].map(h => el("th", { text: h })))]),
          el("tbody", null, body)
        ])])
      );
    }

    // 별 구간 경계·가중치
    const s0 = Settings.get();
    const num = (id, v, step) => el("input", { type: "number", id: id, value: String(v), step: step, min: "0", inputmode: "decimal" });
    const fB1 = num("s-b1", s0.bounds[0], "1"), fB2 = num("s-b2", s0.bounds[1], "1"), fB3 = num("s-b3", s0.bounds[2], "1");
    const fW1 = num("s-w1", s0.weights[0], "0.1"), fW2 = num("s-w2", s0.weights[1], "0.1");
    const applyBtn = el("button", { type: "button", class: "primary", text: "적용" });
    applyBtn.addEventListener("click", async () => {
      const toNum = x => (x.value.trim() === "" ? NaN : Number(x.value));
      const next = { bounds: [fB1, fB2, fB3].map(toNum), weights: [fW1, fW2].map(toNum) };
      const errs = validateSettings(Object.assign({}, Settings.get(), next));
      if (errs.length) { numStatus.replaceChildren(el("ul", { class: "errors" }, errs.map(e => el("li", { text: e })))); return; }
      try {
        await Settings.update(next);
        numStatus.replaceChildren(el("p", { class: "notice", text: "적용했습니다. 모든 곡의 점수와 단계를 다시 계산했습니다." }));
        drawTable();
        lists.forEach(fn => fn());
      } catch (e) { numStatus.replaceChildren(el("p", { class: "bad", text: "저장하지 못했습니다: " + e.message })); }
    });

    // 가사 속 출현 횟수
    function countPhrase(p) {
      const n = VocabEngine.normWord(p), len = n.split(" ").length; let c = 0;
      Analysis.all().bySong.forEach(a => a.lines.forEach(l => l.tokens.forEach(tk => { if (tk.phrase === n) c++; })));
      return Math.round(c / len);
    }
    function countExcluded(w) {
      const n = VocabEngine.normWord(w); let c = 0;
      Analysis.all().bySong.forEach(a => a.lines.forEach(l => l.tokens.forEach(tk => { if (tk.excluded === "word" && tk.lower === n) c++; })));
      return c;
    }

    const lists = [];
    function listEditor(key, inputId, placeholder, counter, checkNew) {
      const box = el("div");
      const input = el("input", { type: "text", id: inputId, placeholder: placeholder, autocomplete: "off", lang: "vi" });
      const addBtn = el("button", { type: "button", text: "추가" });
      const status = el("div", { role: "status" });
      const ul = el("ul", { class: "word-list" });
      function draw() {
        const items = Settings.get()[key];
        ul.replaceChildren.apply(ul, items.map(w => {
          const del = el("button", { type: "button", class: "small-btn", text: "삭제", "aria-label": w + " 삭제" });
          del.addEventListener("click", async () => {
            const next = Settings.get()[key].filter(x => x !== w);
            try { await Settings.update({ [key]: next }); status.replaceChildren(el("p", { class: "notice", text: "'" + w + "'을(를) 뺐습니다. 다시 계산했습니다." })); }
            catch (e) { status.replaceChildren(el("p", { class: "bad", text: e.message })); }
            draw(); drawTable();
          });
          return el("li", null, [el("span", { lang: "vi", class: "wl-word", text: w }), el("span", { class: "small muted", text: "가사에 " + counter(w) + "회" }), del]);
        }));
      }
      async function add() {
        const w = VocabEngine.normWord(input.value);
        const err = checkNew(w);
        if (err) { status.replaceChildren(el("p", { class: "bad", text: err })); return; }
        try {
          await Settings.update({ [key]: Settings.get()[key].concat([w]) });
          input.value = "";
          status.replaceChildren(el("p", { class: "notice", text: "'" + w + "'을(를) 넣었습니다(가사에 " + counter(w) + "회). 다시 계산했습니다." }));
        } catch (e) { status.replaceChildren(el("p", { class: "bad", text: e.message })); }
        draw(); drawTable();
      }
      addBtn.addEventListener("click", add);
      input.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); add(); } });
      input.addEventListener("input", () => status.replaceChildren());
      draw();
      lists.push(draw);
      box.append(el("div", { class: "add-row" }, [input, addBtn]), status, ul);
      return box;
    }

    const multiEditor = listEditor("multiWords", "s-multi", "예: nhẹ nhàng", countPhrase, w => {
      if (!w) return "어휘를 입력하세요.";
      const parts = w.split(" ");
      if (parts.length < 2) return "음절 2개 이상을 띄어 써서 입력하세요(한 음절은 기준표 순위를 그대로 씁니다).";
      if (!parts.every(isSyllable)) return "글자와 띄어쓰기만 쓸 수 있습니다.";
      if (Settings.get().multiWords.includes(w)) return "이미 목록에 있습니다.";
      return null;
    });
    const exEditor = listEditor("excludeWords", "s-ex", "예: baby", countExcluded, w => {
      if (!w) return "단어를 입력하세요.";
      if (!isSyllable(w)) return "음절 하나만 입력하세요. 줄 전체가 외국어라면 가사 화면의 [제외 줄 편집]을 쓰세요.";
      if (VOCAB[w]) return "'" + w + "'은(는) 고빈도 기준표에 있는 음절이라 넣을 수 없습니다(베트남어 보호). 줄 전체가 외국어라면 [제외 줄 편집]을 쓰세요.";
      if (Settings.get().excludeWords.includes(w)) return "이미 목록에 있습니다.";
      return null;
    });

    const kwExEditor = listEditor("keyWordExclude", "s-kwex", "예: ko", w => KeyWords && Repo.getSongs().filter(s => s.status === "ready")
      .reduce((n, s) => { const a = Analysis.get(s.id); if (!a) return n; a.lines.forEach(l => l.tokens.forEach(tk => { if (!tk.excluded && (tk.phrase || tk.lower) === w && (!tk.phrase || tk.lower === w.split(" ")[0])) n++; })); return n; }, 0), w => {
      if (!w) return "단어를 입력하세요.";
      if (!w.split(" ").every(isSyllable)) return "글자와 띄어쓰기만 쓸 수 있습니다.";
      if (Settings.get().keyWordExclude.includes(w)) return "이미 목록에 있습니다.";
      return null;
    });
    const exLinesBox = el("div");
    function drawExLines() {
      const ex = Settings.get().excludedLines;
      const keys = Object.keys(ex).map(Number).sort((a, b) => a - b);
      exLinesBox.replaceChildren.apply(exLinesBox, keys.length ? keys.map(k => {
        const s = Repo.getSong(k);
        return el("p", null, [
          el("a", { href: "#/song/" + k, text: k + "번 " + (s ? s.title : "(없는 곡)") }),
          " — " + ex[String(k)].map(lid => { const l = Repo.getLyrics(k).find(x => x.lineId === lid); return l ? String(l.lineNumber) : "(지운 줄)"; }).join(", ") + "번 줄 (" + ex[String(k)].length + "줄)"
        ]);
      }) : [el("p", { class: "muted", text: "제외 줄이 없습니다." })]);
    }
    drawExLines();
    lists.push(drawExLines);

    const resetStatus = el("div", { role: "status" });
    const resetBtn = el("button", { type: "button", text: "처음 설정으로 되돌리기" });
    resetBtn.addEventListener("click", async () => {
      if (!resetBtn.dataset.confirm) {
        resetBtn.dataset.confirm = "1";
        resetBtn.textContent = "정말 되돌리기";
        resetStatus.replaceChildren(el("p", { class: "need", text: "별 구간, 가중치, 다음절 어휘, 제외 단어, 제외 줄이 모두 처음 값으로 바뀝니다. 계속하려면 [정말 되돌리기]를 누르세요." }));
        return;
      }
      try { await Settings.replace(Settings.defaults()); } catch (e) { resetStatus.replaceChildren(el("p", { class: "bad", text: e.message })); return; }
      const y = window.scrollY; renderSettings(); window.scrollTo(0, y);
    });

    setView([
      el("h2", { text: "설정" }),
      el("p", { class: "hint", text: "어휘 수준과 곡 단계 계산에 쓰는 값입니다. 바꾸면 모든 곡이 바로 다시 계산됩니다. (권한 구분은 5단계에서 적용)" }),
      el("h3", { text: "곡 단계 계산" }), tableBox,
      el("h3", { text: "별 구간 경계 (기준 순위)" }),
      el("p", { class: "hint", text: "기준 순위 = CVT·LangX 중 작은 순위. ★ 1~첫째 값, ★★ ~둘째 값, ★★★ ~셋째 값, ★★★★ 목록 밖 또는 셋째 값 초과." }),
      el("div", { class: "num-row" }, [el("label", { for: "s-b1", text: "★ 끝" }), fB1, el("label", { for: "s-b2", text: "★★ 끝" }), fB2, el("label", { for: "s-b3", text: "★★★ 끝" }), fB3]),
      el("h3", { text: "어휘 점수 가중치" }),
      el("div", { class: "num-row" }, [el("label", { for: "s-w1", text: "★★★ 가중치" }), fW1, el("label", { for: "s-w2", text: "★★★★ 가중치" }), fW2]),
      el("div", { class: "row-actions" }, [applyBtn]), numStatus,
      el("h3", { text: "다음절 어휘 목록" }),
      el("p", { class: "hint", text: "가사에서 긴 어휘부터 맞추고, 어휘 전체에 구성 음절 중 별이 가장 많은 수준을 적용합니다. 문장부호를 사이에 둔 음절은 맞추지 않습니다." }),
      multiEditor,
      el("h3", { text: "제외 단어 목록" }),
      el("p", { class: "hint", text: "베트남어 줄에 섞인 외국어 단어와 감탄사만 넣습니다. 고빈도 기준표에 있는 음절은 베트남어와 철자가 같을 수 있어 넣을 수 없습니다." }),
      exEditor,
      el("h3", { text: "핵심 단어" }),
      (function () {
        const cb = el("input", { type: "checkbox", id: "s-star1", checked: Settings.get().keyWordIncludeStar1 });
        const st = el("p", { class: "small", role: "status" });
        cb.addEventListener("change", async () => {
          try { await Settings.update({ keyWordIncludeStar1: cb.checked }); st.textContent = cb.checked ? "★(1~100위)도 핵심 단어 후보에 넣습니다." : "★(1~100위)는 핵심 단어에서 뺍니다."; }
          catch (e) { st.textContent = e.message; }
        });
        const s0 = Settings.get();
        const f2 = el("input", { type: "number", id: "s-k2", min: "0", max: String(KEYWORD_MAX), step: "1", inputmode: "numeric", value: String(s0.keyWordStar2Max) });
        const f3 = el("input", { type: "number", id: "s-k3", min: "0", max: String(KEYWORD_MAX), step: "1", inputmode: "numeric", value: String(s0.keyWordStar3Min) });
        const ap = el("button", { type: "button", class: "primary", text: "몫 적용" });
        ap.addEventListener("click", async () => {
          const next = { keyWordStar2Max: f2.value.trim() === "" ? NaN : Number(f2.value), keyWordStar3Min: f3.value.trim() === "" ? NaN : Number(f3.value) };
          const errs = validateSettings(Object.assign({}, Settings.get(), next));
          if (errs.length) { st.textContent = errs[0]; return; }
          try { await Settings.update(next); st.textContent = "핵심 단어 몫을 적용했습니다. 모든 곡의 핵심 단어를 다시 골랐습니다."; } catch (e) { st.textContent = e.message; }
        });
        return el("div", null, [
          el("p", { class: "hint", text: "곡당 최대 " + KEYWORD_MAX + "개. ★★ 최대 개수 + ★★★ 최소 개수로 나누고, 한쪽이 모자라면 다른 쪽으로 채웁니다. 그래도 모자라면 뜻이 있는 ★★★★, 그다음 ★(포함할 때)로 채웁니다. 같은 수준에서는 곡 안 반복 횟수가 많은 순." }),
          el("div", { class: "num-row" }, [el("label", { for: "s-k2", text: "★★ 최대" }), f2, el("label", { for: "s-k3", text: "★★★ 최소" }), f3]),
          el("div", { class: "row-actions" }, [ap]),
          el("label", { class: "check" }, [cb, " ★(1~100위 기초어)도 핵심 단어에 포함"]), st,
          el("p", { class: "hint", text: "핵심 단어 제외 목록: 핵심 단어 선정에서만 빼고, 난이도 계산에는 영향을 주지 않습니다." }),
          kwExEditor]);
      })(),

  /* =========================================================
   * 7-2. 4단계: 핵심 단어 · 연습 · 복습
   * ========================================================= */
  const MIN_ELIGIBLE = 4; // 뜻이 있는 단어가 이보다 적으면 문제를 만들지 않는다
  function shuffle(arr) { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
  function starSpan(n) { return el("span", { class: "kw-star s" + n, text: STAR_TEXT[n] }); }
  function similarText(w) {
    const g = Repo.getGlossary();
    return w.similar.length ? w.similar.map(s => s + " (" + VocabEngine.toneText(s) + (g[s] ? ", " + g[s] : "") + ")").join(" · ") : "없음";
  }
  function exampleNodes(w) {
    const ex = w.example;
    if (!ex) return [];
    const hasKo = (ex.korean || "").trim();
    return [el("p", { class: "kw-ex-vi", lang: "vi", text: ex.vietnamese }),
            el("p", { class: "kw-ex-ko" + (hasKo ? "" : " need"), text: hasKo ? ex.korean : "번역 입력 필요" })];
  }
  const STEPS = [["flash", "플래시카드"], ["meaning", "뜻 고르기"], ["blank", "빈칸 고르기"], ["tone", "성조 고르기"]];
  function singHref(songId) {
    const w = KeyWords.eligible(songId)[0] || KeyWords.forSong(songId)[0];
    return w && w.example ? "#/song/" + songId + "/sing/" + w.example.lineId : "#/song/" + songId;
  }
  function nextStepLink(songId, kind) {
    const i = STEPS.findIndex(s => s[0] === kind);
    if (i >= 0 && i + 1 < STEPS.length) return el("a", { class: "btn primary-link", href: "#/practice/" + songId + "/" + STEPS[i + 1][0], text: "다음: " + STEPS[i + 1][1] + " →" });
    return el("a", { class: "btn primary-link", href: singHref(songId), text: "다음: 따라 부르기 →" });
  }

  function renderWords(id) {
    const song = Repo.getSong(id);
    const back = el("a", { class: "btn", href: "#/song/" + id, text: "← 곡으로" });

    const words = KeyWords.forSong(id);
    const eligible = words.filter(w => w.meaning).length;
    const status = el("p", { class: "small", role: "status" });

    const items = words.map(w => {
      const inp = el("input", { type: "text", "aria-label": w.key + " 뜻", placeholder: "뜻 입력 필요", value: w.meaning || "" });
      const save = el("button", { type: "button", text: w.meaning ? "뜻 고치기" : "뜻 저장" });
      save.addEventListener("click", async () => {
        try {
          await Repo.setGlossary({ [w.key]: inp.value });

      });

      return el("li", { class: "kw-item" }, [
        el("div", { class: "kw-head" }, [el("span", { class: "kw-word", lang: "vi", text: w.key }), starSpan(w.star),
          el("span", { class: "small muted", text: "곡에서 " + w.count + "회 · 성조 " + w.tones })]),
        canGloss ? el("div", { class: "kw-mean" }, [w.meaning ? null : el("span", { class: "need small", text: "뜻 입력 필요 " }), inp, save].filter(Boolean))
                 : el("p", { class: "kw-mean" + (w.meaning ? "" : " need"), text: w.meaning || "뜻 입력 필요(선생님이 단어장에 넣으면 보입니다)" }),
        el("p", { class: "small", text: "비슷한 단어: " + similarText(w) }),
        el("div", { class: "kw-ex" }, exampleNodes(w).concat([el("a", { class: "btn small-btn", href: "#/song/" + id + "/sing/" + w.example.lineId, text: "예문 따라 부르기" })]))
      ]);
    });
    const enough = eligible >= MIN_ELIGIBLE;

    const hub = el("div", { class: "hub" }, enough ? [

      el("a", { class: "btn", href: "#/practice/" + id + "/blank", text: "③ 빈칸 고르기" }),

      hub, status,
      words.length ? el("ul", { class: "kw-list" }, items) : el("p", { class: "need", text: "핵심 단어 후보가 없습니다." })
    ], "practice-words");
    window.scrollTo(0, 0);
  }

  /* ----- 문제 만들기 ----- */
  function buildQuestions(id, kind) {
    const words = KeyWords.eligible(id), all = KeyWords.forSong(id), g = Repo.getGlossary(), a = Analysis.get(id);
    const qs = [];
    shuffle(words).forEach(w => {
      if (kind === "meaning") {
        const pool = Array.from(new Set(words.filter(x => x.key !== w.key).map(x => x.meaning)
          .concat(Object.keys(g).filter(k => k !== w.key).map(k => g[k])))).filter(m => m && m !== w.meaning);
        if (pool.length < 3) return;
        qs.push({ word: w, prompt: [el("span", { lang: "vi", class: "q-word", text: w.key }), "의 뜻은?"],
          options: shuffle([{ label: w.meaning, correct: true }].concat(shuffle(pool).slice(0, 3).map(m => ({ label: m })))),
          explain: [w.key + " = " + w.meaning + " · 성조 " + w.tones, "비슷한 단어: " + similarText(w)] });
      } else if (kind === "blank") {
        const others = shuffle(all.filter(x => x.key !== w.key)).slice(0, 3);
        if (others.length < 3 || !a) return;
        const la = a.lines[w.exampleIndex];
        qs.push({ word: w, prompt: [el("p", { class: "q-line", lang: "vi", text: blankedLine(la, null, w.key) }),
            el("p", { class: "small muted", text: (w.example.korean || "").trim() ? w.example.korean : "번역 입력 필요" })],
          hint: "첫 글자: " + w.key.charAt(0),
          options: shuffle([{ label: w.key, lang: "vi", correct: true }].concat(others.map(x => ({ label: x.key, lang: "vi" })))),
          explain: ["원문: " + w.example.vietnamese, w.key + " = " + w.meaning + " · 성조 " + w.tones] });
      } else if (kind === "tone") {
        if (w.similar.length < 2) return; // 변형 2개 → 3지선다, 3개 이상 → 4지선다
        const opts = [w.key].concat(w.similar.slice(0, 3));
        qs.push({ word: w, prompt: ["'" + w.meaning + "'에 맞는 단어는?"],
          options: shuffle(opts.map(o => ({ label: o, lang: "vi", correct: o === w.key }))),
          explain: opts.map(o => o + " — " + VocabEngine.toneText(o) + (g[o] ? " · " + g[o] : (o === w.key ? " · " + w.meaning : ""))) });
      }
    });
    return qs;
  }

  function renderPractice(id, kind) {
    const song = Repo.getSong(id);
    const back = el("a", { class: "btn", href: "#/words/" + id, text: "← 핵심 단어" });
    if (!song || song.status !== "ready") { setView([back, el("p", { text: "학습할 수 있는 곡이 아닙니다." })], "practice-words"); return; }
    const eligible = KeyWords.eligible(id);
    const titles = { flash: "플래시카드", meaning: "뜻 고르기", blank: "빈칸 고르기", tone: "성조 고르기", game: "30초 게임" };
    const box = el("div", { class: "practice-box" });
    const head = [back, el("h2", { text: titles[kind] }), el("p", { class: "artist-line", lang: "vi", text: song.title })];
    if (eligible.length < MIN_ELIGIBLE) {
      setView(head.concat([el("p", { class: "need", text: "단어장 입력 필요 — 뜻이 있는 단어가 " + MIN_ELIGIBLE + "개 이상이어야 합니다(지금 " + eligible.length + "개)." }),
        el("a", { class: "btn", href: "#/words/" + id, text: "뜻 입력하러 가기" })]), "list");
      return;
    }
    setView(head.concat([box]), "list");
    window.scrollTo(0, 0);
    Progress.touch(id);
    if (kind === "flash") Progress.start(id, "flash", eligible.length);
    if (kind === "flash") runFlashcards(box, eligible, { songId: id, logKind: "practice", onDone: (k, c) => (Progress.record(id, "flash", k + c, k).catch(() => {}), fill(box,
      el("p", { class: "notice", text: "플래시카드를 마쳤습니다. 알아요 " + k + " · 헷갈려요 " + c + (c ? " (헷갈려요 단어는 1·3·7일 뒤 복습에 나옵니다)" : "") }),
      el("div", { class: "row-actions" }, [nextStepLink(id, "flash"), el("a", { class: "btn", href: "#/practice/" + id + "/flash", text: "다시 하기" })]))) });
    else if (kind === "game") runGame(box, eligible, id);
    else { const qs = buildQuestions(id, kind); if (qs.length) Progress.start(id, kind, qs.length); runQuiz(box, qs, id, kind); }
  }

  function runFlashcards(box, words, opts) {
    let i = 0, flipped = false, known = 0, confused = 0;
    function draw() {
      if (i >= words.length) { opts.onDone(known, confused); return; }
      const w = words[i];
      const flip = el("button", { type: "button", text: flipped ? "앞면 보기" : "뒤집기" });
      flip.addEventListener("click", () => { flipped = !flipped; draw(); });
      const knowBtn = el("button", { type: "button", class: "primary", text: "알아요" });
      const confBtn = el("button", { type: "button", text: "헷갈려요" });
      knowBtn.addEventListener("click", async () => { if (opts.logKind) Server.logStudy(w.songId != null ? w.songId : opts.songId, opts.logKind).catch(() => {}); known++; if (opts.onKnow) await opts.onKnow(w); i++; flipped = false; draw(); });
      confBtn.addEventListener("click", async () => {
        if (opts.logKind) Server.logStudy(w.songId != null ? w.songId : opts.songId, opts.logKind).catch(() => {}); // 출석
        confused++;
        if (opts.onConfused) await opts.onConfused(w); else await Learner.mark("confused", w);
        i++; flipped = false; draw();
      });
      const g = Repo.getGlossary();
      const back = [
        el("p", { class: "fc-mean", text: w.meaning || g[w.key] || "뜻 입력 필요" }),
        el("p", { class: "small", text: "성조: " + (w.tones || VocabEngine.toneText(w.key)) }),
        el("p", { class: "small", text: "비슷한 단어: " + (w.similar ? similarText(w) : "없음") })
      ].concat(w.example ? exampleNodes(w) : []);
      fill(box,
        el("p", { class: "small muted", text: (i + 1) + " / " + words.length }),
        el("div", { class: "fc-card" }, [el("p", { class: "fc-word", lang: "vi", text: w.key })].concat(flipped ? back : [])),
        el("div", { class: "row-actions" }, [flip]),
        el("div", { class: "row-actions" }, [knowBtn, confBtn]));
    }
    draw();
  }

  function runQuiz(box, qs, songId, kind) {
    if (!qs.length) {
      fill(box, el("p", { class: "need", text: kind === "tone"
        ? "이 곡에는 비슷한 단어(성조만 다른 단어)가 2개 이상인 핵심 단어가 없어 성조 문제를 만들 수 없습니다. 단어장에 성조 변형을 넣으면 생깁니다."
        : "문제를 만들 단어가 부족합니다." }), el("div", { class: "row-actions" }, [nextStepLink(songId, kind)]));
      return;
    }
    let i = 0, sel = null, submitted = false, right = 0, recorded = false;
    const wrongs = [];
    function draw() {
      if (i >= qs.length) {
        if (!recorded) { recorded = true; Progress.record(songId, kind, qs.length, right).catch(() => {}); } // 진도: 연습 종류별 정답률
        fill(box, el("p", { class: "notice", text: qs.length + "문제 중 " + right + "개 정답" }),
          wrongs.length ? el("p", { text: "틀린 단어(1·3·7일 뒤 복습): " + wrongs.join(", ") }) : null,
          el("div", { class: "row-actions" }, [nextStepLink(songId, kind), el("a", { class: "btn", href: "#/practice/" + songId + "/" + kind, text: "다시 하기" }), el("a", { class: "btn", href: "#/review", text: "오늘의 복습" })]));
        return;
      }
      const q = qs[i];
      const optBtns = q.options.map((o, k) => {
        let cls = "opt";
        if (submitted && o.correct) cls += " opt-right";
        else if (submitted && k === sel) cls += " opt-wrong";
        const b = el("button", { type: "button", class: cls, lang: o.lang || null, "aria-pressed": String(k === sel), disabled: submitted,
          text: (submitted && o.correct ? "✓ " : submitted && k === sel ? "✗ " : "") + o.label });
        b.addEventListener("click", () => { sel = k; draw(); });
        return b;
      });
      const hintP = el("p", { class: "small", role: "status" });
      const hintBtn = q.hint && !submitted ? el("button", { type: "button", text: "힌트" }) : null;
      if (hintBtn) hintBtn.addEventListener("click", () => { hintP.textContent = q.hint; });
      const submit = el("button", { type: "button", class: "primary", text: "제출", disabled: sel === null });
      submit.addEventListener("click", async () => {
        Server.logStudy(songId, "practice").catch(() => {}); // 출석: 연습 문제 1개 이상 제출
        submitted = true;
        if (q.options[sel].correct) right++;
        else { wrongs.push(q.word.key); await Learner.mark("wrong", q.word); }
        draw();
      });
      const nextBtn = el("button", { type: "button", class: "primary", text: i + 1 < qs.length ? "다음 문제" : "결과 보기" });
      nextBtn.addEventListener("click", () => { i++; sel = null; submitted = false; draw(); });
      const ok = submitted && q.options[sel].correct;
      fill(box,
        el("p", { class: "small muted", text: (i + 1) + " / " + qs.length }),
        el("div", { class: "q-prompt" }, q.prompt),
        hintBtn, hintP,
        el("div", { class: "opts" }, optBtns),
        submitted ? el("div", { class: "q-result " + (ok ? "q-ok" : "q-bad") }, [
          el("p", { class: "q-verdict", text: ok ? "정답입니다." : "틀렸습니다. 정답: " + q.options.find(o => o.correct).label })
        ].concat(q.explain.map(x => el("p", { class: "small", lang: "vi", text: x })))) : null,
        el("div", { class: "row-actions" }, [submitted ? nextBtn : submit]));
    }
    draw();
  }

  function runGame(box, words, songId) {
    const GAME_SEC = 30, BOARD = 5;
    let right = 0, wrong = 0, left = GAME_SEC, timer = null, board = [], pickW = null, pickM = null, running = false;
    function newBoard() {
      const ws = shuffle(words).slice(0, Math.min(BOARD, words.length));
      board = { words: ws.map(w => ({ w: w, done: false })), means: shuffle(ws).map(w => ({ w: w, done: false })) };
      pickW = pickM = null;
    }
    function finish() {
      clearInterval(timer); running = false;
      Progress.record(songId, "game", right + wrong, right).catch(() => {});
      fill(box, el("p", { class: "notice", text: "끝! 정답 " + right + "개 · 오답 " + wrong + "개" }),
        el("div", { class: "row-actions" }, [(function () { const b = el("button", { type: "button", class: "primary", text: "다시 하기" }); b.addEventListener("click", start); return b; })(),
          el("a", { class: "btn", href: "#/words/" + songId, text: "핵심 단어" })]));
    }
    function check() {
      if (!pickW || !pickM) return;
      if (pickW.w.key === pickM.w.key) { right++; pickW.done = pickM.done = true; }
      else wrong++;
      pickW = pickM = null;
      if (board.words.every(x => x.done)) newBoard();
    }
    function draw() {
      if (!running) return;
      const col = (arr, isWord) => el("div", { class: "g-col" }, arr.map(x => {
        const picked = isWord ? pickW === x : pickM === x;
        const b = el("button", { type: "button", class: "g-btn", lang: isWord ? "vi" : null, disabled: x.done, "aria-pressed": String(picked),
          text: isWord ? x.w.key : x.w.meaning });
        b.addEventListener("click", () => { if (isWord) pickW = x; else pickM = x; check(); draw(); });
        return b;
      }));
      fill(box, el("p", { class: "g-stat", text: "남은 시간 " + left + "초 · 정답 " + right + " · 오답 " + wrong }),
        el("p", { class: "small muted", text: "왼쪽 단어와 오른쪽 뜻을 하나씩 눌러 짝을 맞추세요." }),
        el("div", { class: "g-board" }, [col(board.words, true), col(board.means, false)]));
    }
    function start() {
      right = wrong = 0; left = GAME_SEC; running = true; newBoard(); draw();
      clearInterval(timer);

  /* ----- 단어장(뜻) ----- */
  let glossSong = null;
  function renderGlossary() {
    const status = el("div", { role: "status" });
    const listBox = el("div");
    const ta = el("textarea", { id: "g-paste", spellcheck: "false", placeholder: "chờ\t기다리다\nnhớ\t그리워하다" });
    const preview = el("div");
    function parsePaste() {
      const rows = [], errors = [], skipped = [];
      const seen = new Map();
      ta.value.replace(/\r\n?/g, "\n").split("\n").forEach((line, i) => {
        if (!line.trim()) return;
        const parts = line.split("\t");
        if (parts[0].trim() === "단어" && (parts[1] || "").trim() === "뜻") return; // 머리글 줄
        if (parts.length < 2) { errors.push((i + 1) + "번째 줄: 탭으로 나뉘어 있지 않습니다(단어 [탭] 뜻)."); return; }
        const w = VocabEngine.normWord(parts[0]), m = parts.slice(1).join("\t").trim();
        if (!w) { errors.push((i + 1) + "번째 줄: 단어가 비었습니다."); return; }
        if (!m) { skipped.push(w); return; }
        if (seen.has(w)) errors.push((i + 1) + "번째 줄: '" + w + "'이(가) " + seen.get(w) + "번째 줄과 겹칩니다(뒤의 뜻을 씁니다).");
        seen.set(w, i + 1);
        rows.push({ w: w, m: m });
      });
      return { rows: rows, errors: errors, skipped: skipped };
    }
    function drawPreview() {
      const r = parsePaste(), g = Repo.getGlossary();
      fill(preview,
        el("p", { class: "small", text: "넣을 단어 " + r.rows.length + "개" + (r.skipped.length ? " · 뜻이 빈 줄 " + r.skipped.length + "개는 건너뜀" : "") }),
        r.errors.length ? el("ul", { class: "warnings" }, r.errors.map(e => el("li", { text: e }))) : null,
        r.rows.length ? el("div", { class: "table-wrap" }, [el("table", null, [
          el("thead", null, [el("tr", null, ["단어", "뜻", "상태"].map(h => el("th", { text: h })))]),
          el("tbody", null, r.rows.map(x => el("tr", null, [el("td", { lang: "vi", text: x.w }), el("td", { text: x.m }),
            el("td", { class: "small", text: !g[x.w] ? "새로 넣음" : g[x.w] === x.m ? "같음" : "바뀜(기존: " + g[x.w] + ")" })])))])]) : null);
      return r;
    }
    ta.addEventListener("input", drawPreview);
    const addBtn = el("button", { type: "button", class: "primary", text: "단어장에 넣기" });
    addBtn.addEventListener("click", async () => {
      const r = drawPreview();
      if (!r.rows.length) { status.replaceChildren(el("p", { class: "bad", text: "넣을 단어가 없습니다." })); return; }
      const entries = {}; r.rows.forEach(x => { entries[x.w] = x.m; });
      try { await Repo.setGlossary(entries); ta.value = ""; drawPreview(); drawList(); status.replaceChildren(el("p", { class: "notice", text: r.rows.length + "개 단어의 뜻을 넣었습니다." })); }
      catch (e) { status.replaceChildren(el("p", { class: "bad", text: e.message })); }
    });
    // 곡별: 곡을 고르면 그 곡의 핵심 단어(10개)와 다른 단어에 바로 뜻을 넣는다
    const songBox = el("div");
    const readySongs = Repo.getSongs().filter(s => s.status === "ready");
    if (!readySongs.some(s => s.id === glossSong)) { const need = readySongs.find(s => KeyWords.forSong(s.id).some(w => !w.meaning)); glossSong = (need || readySongs[0] || {}).id || null; }
    function drawSong() {
      if (!glossSong) { songBox.replaceChildren(el("p", { class: "muted", text: "학습 가능한 곡이 없습니다." })); return; }
      const g = Repo.getGlossary();
      const sel = el("select", { id: "g-song", "aria-label": "곡 고르기" }, readySongs.map(s => {
        const n = KeyWords.forSong(s.id).filter(w => !w.meaning).length;
        return el("option", { value: String(s.id), lang: "vi", selected: s.id === glossSong, text: s.id + ". " + s.title + (n ? " (뜻 필요 " + n + ")" : " (뜻 모두 있음)") });
      }));
      sel.addEventListener("change", () => { glossSong = Number(sel.value); drawSong(); });
      const kw = KeyWords.forSong(glossSong);
      const kwSet = new Set(kw.map(w => w.key));
      const an = Analysis.get(glossSong), others = new Map();
      if (an) an.lines.forEach(l => l.tokens.forEach(tk => { if (tk.excluded) return; const w = VocabEngine.normWord(tk.phrase || tk.lower); if (!kwSet.has(w) && !others.has(w)) others.set(w, tk.star); }));
      const row = (w, extra) => {
        const inp = el("input", { type: "text", "aria-label": w + " 뜻", placeholder: "뜻 입력 필요", value: g[w] || "" });
        const sv = el("button", { type: "button", class: "small-btn", text: "저장" }), st = el("span", { class: "small", role: "status" });
        const save = async () => { try { await Repo.setGlossary({ [w]: inp.value.trim() }); st.textContent = inp.value.trim() ? "저장함" : "지움"; } catch (e) { st.textContent = "⚠ " + e.message; } };
        sv.addEventListener("click", save); inp.addEventListener("keydown", ev => { if (ev.key === "Enter") save(); });
        return el("li", { class: "gl-row" }, [el("span", { class: "wl-word", lang: "vi", text: w }), extra || null, inp, sv, st].filter(Boolean));
      };
      const stars = n => el("span", { class: "small muted", text: "★".repeat(n || 0) });
      const missing = Array.from(others.entries()).filter(([w]) => !g[w]).sort((a, b) => (b[1] || 0) - (a[1] || 0) || a[0].localeCompare(b[0], "vi"));
      fill(songBox, el("div", { class: "pr-song" }, [el("label", { for: "g-song", text: "곡 고르기" }), sel]),
        el("p", { class: "small strong", text: "이 곡의 핵심 단어 " + kw.length + "개 (뜻을 넣거나 고친 뒤 [저장] 또는 Enter)" }),
        kw.length ? el("ul", { class: "word-list gl-list" }, kw.map(w => row(w.key, stars(w.star)))) : el("p", { class: "muted", text: "핵심 단어가 없습니다." }),
        el("details", null, [el("summary", { text: "이 곡의 다른 단어 · 뜻 없음 " + missing.length + "개 (뜻을 넣으면 핵심 단어 후보가 됩니다)" }),
          el("ul", { class: "word-list gl-list" }, missing.map(([w, st]) => row(w, stars(st))))]),
        el("p", { class: "hint", text: "핵심 단어는 별 단계(★★·★★★)와 뜻이 있는지에 따라 곡마다 최대 10개가 정해집니다. 뜻을 넣으면 바로 학생 연습에 쓰입니다." }));
    }
    function drawList() {
      drawSong();
      const g = Repo.getGlossary(), keys = Object.keys(g).sort((a, b) => a.localeCompare(b, "vi"));
      const need = Repo.getSongs().filter(s => s.status === "ready").map(s => ({ s: s, n: KeyWords.forSong(s.id).filter(w => !w.meaning).length })).filter(x => x.n);
      fill(listBox,
        need.length ? el("div", null, [el("p", { class: "small", text: "뜻이 필요한 핵심 단어:" })].concat(need.map(x =>
          el("a", { class: "btn small-btn", href: "#/words/" + x.s.id, text: x.s.id + "번 " + x.s.title + " (" + x.n + "개)" })))) : null,
        el("h3", { text: "단어장 (" + keys.length + "개)" }),
        keys.length ? el("ul", { class: "word-list" }, keys.map(k => {
          const del = el("button", { type: "button", class: "small-btn", text: "삭제", "aria-label": k + " 삭제" });
          del.addEventListener("click", async () => { await Repo.setGlossary({ [k]: "" }); drawList(); });
          return el("li", null, [el("span", { lang: "vi", class: "wl-word", text: k }), el("span", { text: g[k] }), del]);
        })) : el("p", { class: "muted", text: "단어장이 비어 있습니다." }));
    }
    setView([
      el("h2", { text: "단어장" }),
      el("h3", { text: "곡별로 뜻 넣기" }), songBox,
      el("h3", { text: "한꺼번에 붙여넣기" }),
      el("p", { class: "hint", text: "핵심 단어의 한국어 뜻은 여기 단어장에서만 가져옵니다(앱이 뜻을 만들지 않습니다). 엑셀 등에서 '단어 [탭] 뜻' 두 칸을 복사해 붙여넣으세요. 뜻이 빈 줄은 건너뜁니다." }),
      el("label", { for: "g-paste", text: "붙여넣기" }), ta, preview,
      el("div", { class: "row-actions" }, [addBtn]), status, listBox
    ], "glossary");
    drawPreview(); drawList();
    window.scrollTo(0, 0);
  }

  const ATTEND_RULE = "출석 = 그날(한국 날짜) 연습 문제 1개 이상 제출, 따라 부르기 녹음 1개 이상 저장, 오늘의 복습에서 1단어 이상 답함 중 하나. 학습 화면을 열기만 한 날은 출석이 아닙니다.";
  function mountAttendance(box, uid) {
    box.replaceChildren(el("p", { class: "muted", text: "출석을 불러오는 중…" }));
    const T = todayStr();
    Server.attendance(uid, T).then(d => {
      const a = d.summary, days = new Set(d.days);
      const [y, m] = T.split("-").map(Number);
      const first = new Date(y, m - 1, 1), nDays = new Date(y, m, 0).getDate();
      const lead = (first.getDay() + 6) % 7; // 월요일 시작
      const cells = ["월", "화", "수", "목", "금", "토", "일"].map(w => el("div", { class: "cal-h", text: w }));
      for (let i = 0; i < lead; i++) cells.push(el("div", { class: "cal-c empty" }));
      for (let dd = 1; dd <= nDays; dd++) {
        const ds = y + "-" + String(m).padStart(2, "0") + "-" + String(dd).padStart(2, "0");
        const on = days.has(ds);
        cells.push(el("div", { class: "cal-c" + (on ? " on" : "") + (ds === T ? " today" : ""), "aria-label": ds + (on ? " 출석" : "") },
          [el("span", { class: "cal-d", text: String(dd) }), on ? el("span", { class: "cal-s", text: "출석" }) : null]));
      }
      const stat = (k, v) => el("div", { class: "stat" }, [el("span", { class: "small muted", text: k }), el("strong", { text: v })]);
      const badge = (label, date) => el("li", null, [el("span", { class: "badge-word" + (date ? " got" : ""), text: label }),
        el("span", { class: "small " + (date ? "ok" : "muted"), text: date ? date + " 받음" : "아직" })]);
      fill(box,
        el("div", { class: "stat-grid" }, [stat("현재 연속", a.streak + "일"), stat("최장 연속", a.longest + "일"),
          stat("이번 학기 출석", a.attend_semester + "일"), stat("이번 주 출석", a.attend_week + "일")]),
        el("p", { class: "small muted", text: "이번 학기는 " + a.semester_start + "부터 셉니다. 오늘 " + (a.attended_today ? "출석했습니다." : "아직 출석하지 않았습니다.") }),
        el("p", { class: "small strong", text: y + "년 " + m + "월" }),
        el("div", { class: "cal" }, cells),
        el("ul", { class: "word-list" }, [badge("7일 연속 출석", a.badge7), badge("30일 연속 출석", a.badge30)]),
        el("p", { class: "hint", text: ATTEND_RULE + " 배지는 연속이 끊겨도 남습니다." }));
    }).catch(e => box.replaceChildren(el("p", { class: "bad", text: e.message })));
  }

  /* ----- 6단계: 바뀐 개인정보 안내(이전에 가입한 사용자가 처음 로그인할 때 한 번) ----- */
  function renderPrivacyNotice() {
    const ok = el("button", { type: "button", class: "primary", text: "확인" });
    const st = el("p", { class: "small", role: "status" });
    ok.addEventListener("click", async () => {
      ok.disabled = true;
      try { await Server.ackNotice("privacy"); renderNav(); route(); } catch (e) { st.textContent = e.message; ok.disabled = false; }
    });
    setView([el("h2", { text: "개인정보 안내가 바뀌었습니다" }),
      el("p", { class: "next-line", text: RECORDING_NOTICE }),
      el("div", { class: "privacy" }, PRIVACY_TEXT.map((x, i) => el("p", { class: i ? "small" : "small strong", text: x }))),
      el("p", { class: "small", text: "[확인]을 누르면 확인한 시각이 저장되고, 앱을 계속 쓸 수 있습니다." }),
      el("div", { class: "row-actions" }, [ok]), st], "");
  }

  /* ----- 내 녹음(본인만) + 6단계 선생님께 제출·피드백 ----- */
  function renderRecordings() {
    const box = el("div", null, [el("p", { class: "muted", text: "불러오는 중…" })]);
    const msg = el("div", { role: "status" });
    const player = el("audio", { controls: true, style: "width:100%" });
    async function draw() {
      const [list, subs] = await Promise.all([Server.myRecordings(), Server.mySubmissions()]);
      const limit = Settings.get().recordingLimit || 20;
      const subByRec = new Map(subs.map(s => [s.recording_id, s])), subBySong = new Map(subs.map(s => [s.song_id, s]));
      const myClasses = Repo.getClasses().filter(c => Repo.memberOf(c.id) && !c.archived);
      const isNew = s => s && s.feedback_at && (!s.seen_at || s.seen_at < s.feedback_at);
      const anyNew = subs.some(isNew);
      const cards = list.slice().reverse().map(r => {
        const s = Repo.getSong(r.song_id), l = s ? Repo.getLyrics(s.id).find(x => x.lineId === r.line_id) : null;
        const sub = subByRec.get(r.id), other = r.song_id != null ? subBySong.get(r.song_id) : null;
        const area = el("div");
        const play = el("button", { type: "button", text: "듣기" });
        play.addEventListener("click", async () => { try { player.src = await Server.recordingUrl(r); await player.play(); } catch (e) { msg.replaceChildren(el("p", { class: "bad", text: e.message })); } });
        const del = el("button", { type: "button", class: "small-btn", text: "지우기" });
        del.addEventListener("click", async () => {
          if (del.dataset.confirm !== "1") {
            del.dataset.confirm = "1"; del.textContent = "정말 지우기"; del.classList.add("danger");
            if (sub) area.replaceChildren(el("p", { class: "need", text: "제출된 녹음입니다. 지우면 선생님께 낸 제출(과 피드백)도 함께 사라집니다. 그래도 지우려면 [정말 지우기]를 누르세요." }));
            return;
          }
          try { await Server.deleteRecording(r); await draw(); refreshNavCounts(); } catch (e) { msg.replaceChildren(el("p", { class: "bad", text: e.message })); }
        });
        const acts = [play];
        const info = [];
        if (sub) {
          const c = Repo.getClasses().find(x => x.id === sub.class_id);
          info.push(el("p", { class: "small ok", text: "제출됨 · " + (c ? c.name : "반") + " · " + fmtDateTime(sub.submitted_at) }));
          if (sub.feedback_at) {
            info.push(el("div", { class: "fb-box" + (isNew(sub) ? " new" : "") }, [
              el("p", { class: "small strong", text: (isNew(sub) ? "새 피드백 · " : "선생님 피드백 · ") + fmtDateTime(sub.feedback_at) }),
              sub.feedback_pron ? el("p", { class: "small", text: "발음: " + sub.feedback_pron }) : null,
              sub.feedback_tone ? el("p", { class: "small", text: "성조: " + sub.feedback_tone }) : null,
              sub.feedback_note ? el("p", { class: "small", text: "한마디: " + sub.feedback_note }) : null].filter(Boolean)));
            info.push(el("p", { class: "small muted", text: "피드백을 받은 제출은 바꾸거나 취소할 수 없습니다." }));
          } else {
            const cancel = el("button", { type: "button", class: "small-btn", text: "제출 취소" });
            cancel.addEventListener("click", async () => { try { await Server.cancelSubmission(r.id); await draw(); refreshNavCounts(); } catch (e) { msg.replaceChildren(el("p", { class: "bad", text: e.message })); } });
            acts.push(cancel);
          }
        } else if (myClasses.length && r.song_id != null) {
          if (other && other.feedback_at) info.push(el("p", { class: "small muted", text: "이 곡은 피드백을 받은 제출이 있어 다시 제출할 수 없습니다." }));
          else {
            const sel = myClasses.length > 1 ? el("select", { "aria-label": "제출할 반" }, myClasses.map(c => el("option", { value: c.id, text: c.name }))) : null;
            const go = el("button", { type: "button", class: "primary small-btn", text: other ? "이 녹음으로 바꿔 제출" : "선생님께 제출" });
            const doSubmit = async () => {
              try { await Server.submitRecording(r.id, sel ? sel.value : myClasses[0].id); msg.replaceChildren(el("p", { class: "notice", text: "선생님께 제출했습니다. 피드백을 받기 전에는 바꾸거나 취소할 수 있습니다." })); await draw(); }
              catch (e) { msg.replaceChildren(el("p", { class: "bad", text: e.message })); }
            };
            go.addEventListener("click", () => {
              if (Server.profile().submit_notice_at) { doSubmit(); return; }
              const ok = el("button", { type: "button", class: "primary", text: "확인하고 제출" }), no = el("button", { type: "button", text: "취소" });
              ok.addEventListener("click", async () => { try { await Server.ackNotice("submit"); await doSubmit(); } catch (e) { msg.replaceChildren(el("p", { class: "bad", text: e.message })); } });
              no.addEventListener("click", () => area.replaceChildren());
              area.replaceChildren(el("div", { class: "ed-form" }, [el("p", { class: "strong", text: RECORDING_NOTICE }), el("div", { class: "row-actions" }, [ok, no])]));
            });
            if (other) info.push(el("p", { class: "small muted", text: "이 곡은 다른 녹음을 이미 제출했습니다. 곡마다 1개만 제출되며, 바꾸면 이전 제출이 이 녹음으로 바뀝니다." }));
            if (sel) acts.push(sel);
            acts.push(go);
          }
        }
        acts.push(del);
        return el("div", { class: "card" }, [
          el("p", { class: "card-title", lang: "vi", text: (s ? s.title : (r.song_id != null ? r.song_id + "번 곡" : "곡 없음")) + (l ? " · " + l.lineNumber + "번 줄" : "") }),
          l ? el("p", { class: "small", lang: "vi", text: l.vietnamese }) : null,
          el("p", { class: "small muted", text: fmtDateTime(r.created_at) + " · " + Math.round((r.size_bytes || 0) / 1024) + "KB" })]
          .concat(info, [el("div", { class: "acts" }, acts), area]).filter(Boolean));
      });
      fill(box,
        el("p", { text: "보관 " + list.length + " / " + limit + "개" }),
        el("p", { class: "hint", text: myClasses.length ? RECORDING_NOTICE + " 곡마다 1개만 제출할 수 있습니다." : "녹음은 본인만 들을 수 있습니다. 반에 참여하면 선생님께 제출할 수 있습니다." }),
        list.length ? el("div", { class: "cards" }, cards) : el("p", { class: "muted", text: "저장한 녹음이 없습니다. 곡 화면의 따라 부르기에서 녹음 후 [보관함에 저장]을 누르세요." }));
      if (anyNew) { try { await Server.markFeedbackSeen(); } catch (e) {} refreshNavCounts(); }
    }
    setView([el("a", { class: "btn", href: "#/submit", text: "← 과제 제출" }), el("h2", { text: "과제 외 녹음 보내기" }),
      el("p", { class: "hint", text: "과제와 상관없이 선생님께 녹음을 보내고 싶을 때 씁니다. 과제 녹음은 [과제 제출]에서 내세요." }), player, msg, box], "recordings");
    draw().catch(e => box.replaceChildren(el("p", { class: "bad", text: e.message })));
    window.scrollTo(0, 0);
  }

  /* ----- 6단계: 제출된 녹음(교사 = 자기 반, 관리자 = 전체) — 듣기, 원곡 그 줄과 비교, 피드백 ----- */
  function renderSubmissions() {
    const box = el("div", null, [el("p", { class: "muted", text: "불러오는 중…" })]);
    const msg = el("div", { role: "status" });
    const stu = el("audio", { controls: true, style: "width:100%" });
    const ytBox = el("div", { class: "sub-yt", hidden: true }, [el("div", { id: "sub-yt" })]);
    const ytMsg = el("p", { class: "small", role: "status" });
    let filterCls = "all", yt = null, ytVideo = null, stopAt = null, guard = 0;
    const timer = setInterval(() => { if (yt && stopAt != null && Date.now() > guard && yt.getCurrentTime && yt.getCurrentTime() >= stopAt) { yt.pauseVideo(); stopAt = null; } }, 200);
    function segmentOf(item) {
      const song = Repo.getSong(item.song_id);
      if (!song) return { err: "이 곡의 원곡 정보를 볼 수 없습니다." };
      if (!song.videoUrl || !youtubeId(song.videoUrl)) return { err: "이 곡은 영상 링크가 없습니다." };
      const off = song.syncOffset || 0;
      const timed = Repo.getLyrics(song.id).filter(x => typeof x.startTime === "number").sort((a, b) => a.startTime - b.startTime);
      const i = timed.findIndex(x => x.lineId === item.line_id);
      if (i < 0) return { err: "이 줄은 싱크가 없어 원곡 줄을 들을 수 없습니다(자막 싱크 설정 필요)." };
      return { vid: youtubeId(song.videoUrl), start: Math.max(0, timed[i].startTime + off), end: i + 1 < timed.length ? timed[i + 1].startTime + off : timed[i].startTime + off + 8 };
    }
    async function playOriginal(item) {
      const seg = segmentOf(item);
      if (seg.err) { ytMsg.textContent = seg.err; return; }
      stu.pause();
      ytBox.hidden = false; ytMsg.textContent = item.song_title + " · " + (item.line_number || "") + "번 줄 원곡 재생 (" + fmtClock(seg.start) + "~" + fmtClock(seg.end) + ")";
      try {
        const YT = await loadYouTubeApi();
        const go = () => { guard = Date.now() + 600; yt.seekTo(seg.start, true); yt.playVideo(); stopAt = seg.end; };
        if (yt && ytVideo === seg.vid) { go(); return; }
        if (yt) { try { yt.destroy(); } catch (e) {} activePlayers = activePlayers.filter(p => p !== yt); }
        ytBox.replaceChildren(el("div", { id: "sub-yt" }));
        ytVideo = seg.vid;
        yt = new YT.Player("sub-yt", { videoId: seg.vid, playerVars: { playsinline: 1, rel: 0, cc_load_policy: 0 }, events: { onReady: go,
          onError: ev => { ytMsg.textContent = "원곡을 재생할 수 없습니다(유튜브 오류 " + ev.data + ")."; } } });
        activePlayers.push(yt);
      } catch (e) { ytMsg.textContent = e.message; }
    }
    let items = [], overall = [], openKey = null;
    const keyOf = x => [x.user_id, x.class_id, x.song_id, x.assignment_id || ""].join("|");
    function draw() {
      const classes = {}; items.forEach(x => { classes[x.class_id] = x.class_name; });
      const sel = el("select", { id: "sb-cls" }, [el("option", { value: "all", text: "전체 반", selected: filterCls === "all" })].concat(Object.keys(classes).map(k => el("option", { value: k, text: classes[k], selected: filterCls === k }))));
      sel.addEventListener("change", () => { filterCls = sel.value; draw(); });
      const shown = items.filter(x => filterCls === "all" || x.class_id === filterCls);
      const groups = new Map();
      shown.forEach(x => { const k = keyOf(x); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(x); });
      const gl = Array.from(groups.entries()).map(([k, rows]) => {
        const f = rows[0], of = overall.find(o => keyOf(Object.assign({}, o, { assignment_id: o.assignment_id || "" })) === k);
        rows.sort((a, b) => (a.line_number || 9999) - (b.line_number || 9999) || String(a.submitted_at).localeCompare(String(b.submitted_at)));
        return { k, rows, f, of, last: rows.reduce((m, r) => String(r.submitted_at) > m ? String(r.submitted_at) : m, ""), lineDone: rows.filter(r => r.feedback_at).length };
      }).sort((a, b) => Number(!!a.of) - Number(!!b.of) || b.last.localeCompare(a.last));
      fill(box,
        el("div", { class: "filters" }, [el("div", null, [el("label", { for: "sb-cls", text: "반" }), sel])]),
        el("p", { class: "small muted", text: "제출 묶음 " + gl.length + "개 · 전체 피드백 전 " + gl.filter(g => !g.of).length + "개 (피드백 전이 위에 옵니다)" }),
        gl.length ? el("div", { class: "cards" }, gl.map(g => {
          const head = el("summary", { class: "grp-head" }, [el("span", { class: "card-title", text: "제출자: " + g.f.student }),
            el("span", { class: "small", lang: "vi", text: (g.f.assignment_title ? "과제 '" + g.f.assignment_title + "'" : "과제 외 제출") + " · " + (g.f.song_title || g.f.song_id + "번 곡") }),
            el("span", { class: "small muted", text: g.rows.length + "줄 · 줄 피드백 " + g.lineDone + "/" + g.rows.length + " · 전체 피드백 " + (g.of ? "완료" : "전") + " · 최근 제출 " + fmtDateTime(g.last) })]);
          const ta = (label, v) => { const a = el("textarea", { class: "ed-ta", "aria-label": "전체 피드백 " + label, maxlength: "1000" }); a.value = v || ""; return a; };
          const o1 = ta("발음", g.of && g.of.pron), o2 = ta("성조", g.of && g.of.tone), o3 = ta("한마디", g.of && g.of.note);
          const osave = el("button", { type: "button", class: "primary", text: g.of ? "전체 피드백 고쳐 저장" : "전체 피드백 저장" }), ost = el("p", { class: "small", role: "status" });
          osave.addEventListener("click", async () => { osave.disabled = true;
            try { await Server.giveOverall(g.f.user_id, g.f.class_id, g.f.song_id, g.f.assignment_id, o1.value, o2.value, o3.value); ost.textContent = "저장했습니다. 학생의 [과제 제출]에 보입니다."; openKey = g.k; await reload(); }
            catch (e) { ost.textContent = "⚠ " + e.message; osave.disabled = false; } });
          const lines = g.rows.map(x => {
            const listen = el("button", { type: "button", class: "small-btn", text: "학생 녹음 듣기" }), orig = el("button", { type: "button", class: "small-btn", text: "원곡 그 줄" });
            listen.addEventListener("click", async () => { try { if (yt) yt.pauseVideo(); stu.src = await Server.pathUrl(x.path); await stu.play(); } catch (e) { msg.replaceChildren(el("p", { class: "bad", text: "⚠ " + e.message })); } });
            orig.addEventListener("click", () => playOriginal(x));
            const t1 = el("input", { type: "text", maxlength: "500", "aria-label": "줄 피드백 발음", placeholder: "발음", value: x.feedback_pron || "" });
            const t2 = el("input", { type: "text", maxlength: "500", "aria-label": "줄 피드백 성조", placeholder: "성조", value: x.feedback_tone || "" });
            const t3 = el("input", { type: "text", maxlength: "500", "aria-label": "줄 피드백 한마디", placeholder: "한마디", value: x.feedback_note || "" });
            const sv = el("button", { type: "button", class: "small-btn", text: x.feedback_at ? "줄 피드백 고침" : "줄 피드백 저장" }), st = el("span", { class: "small", role: "status" });
            sv.addEventListener("click", async () => { try { await Server.giveFeedback(x.recording_id, t1.value, t2.value, t3.value); st.textContent = "저장함"; openKey = g.k; await reload(); } catch (e) { st.textContent = "⚠ " + e.message; } });
            return el("li", { class: "sub-line" }, [el("div", { class: "sl-row" }, [el("span", { class: "ln", text: x.line_number ? x.line_number + "번" : "-" }), el("span", { class: "lt", lang: "vi", text: x.line_text || "" })]),
              el("p", { class: "small muted", text: "제출 " + fmtDateTime(x.submitted_at) + (x.feedback_at ? " · 줄 피드백 완료" : "") }),
              el("div", { class: "acts" }, [listen, orig]), el("details", null, [el("summary", { text: "줄 피드백" + (x.feedback_at ? " (완료)" : "") }), el("div", { class: "line-fb" }, [t1, t2, t3, el("div", { class: "acts" }, [sv, st])])])]);
          });
          const gm = gmailPanel({ name: g.f.student, email: emailMap.get(g.f.user_id) }, async () => {
            const d = await Server.studyDetail(g.f.user_id);

      el("div", { class: "row-actions" }, [prevBtn]), upResult);
    // 서버 복구
    const resIn = el("input", { type: "file", accept: "application/json,.json", id: "res-file" });
    const resPrev = el("div");
    function previewRestore(payload, label) {
      Server.exportAll().then(nowExp => {

        const cmp = compareRows([["사용자", a.users, b.users, "(계정이 없는 사람은 건너뜀)"], ["반", a.classes, b.classes], ["반 참여", a.members, b.members], ["곡", a.songs, b.songs], ["가사 줄", a.lyrics, b.lyrics],
          ["싱크된 줄", a.synced, b.synced], ["단어장", a.glossary, b.glossary], ["가사 수정 기록", a.edits, b.edits], ["복습 기록", a.review, b.review], ["연습 결과", a.practice, b.practice]]);

            el("p", { class: "small", text: "보통은 실수입니다. '서버로 올리기 직전' 보관본은 처음 올리기 전의 빈 서버일 수 있습니다." }),
            el("label", { class: "check" }, [cb, " 서버를 비우는 것을 알고 복구합니다"])]);
        }
        go.addEventListener("click", async () => {
          go.disabled = true;
          try {
            const rep = await Server.restore(payload); // 서버가 복구 직전 자동 보관
            await loadUserData(); renderNav();
            fill(resPrev, el("p", { class: "notice", text: "복구했습니다. 복구 직전 서버 데이터는 자동 보관본 " + rep.snapshot + "번으로 남았습니다." }),

            await drawSnaps();
          } catch (e) { go.disabled = false; resPrev.appendChild(el("p", { class: "bad", text: "복구하지 못했습니다: " + e.message })); }
        });
        fill(resPrev, el("p", { text: label + " · 백업 시각: " + fmtDateTime(payload.exportedAt) }),
          el("p", { class: "need", text: "복구는 서버의 곡·가사·싱크·단어장·설정·반·학습 기록을 통째로 바꿉니다. 로그인 계정과 녹음 파일은 바뀌지 않습니다. 복구 직전 서버 데이터를 자동 보관합니다." }),

          emptyGuard, el("div", { class: "row-actions" }, [go]));
      }).catch(e => resPrev.replaceChildren(el("p", { class: "bad", text: e.message })));
    }
    resIn.addEventListener("change", async () => {
      try { const p = await readFile(resIn.files[0]); if (!p || p.kind !== "server-backup") throw new Error("서버 백업 파일이 아닙니다."); previewRestore(p, "파일 '" + resIn.files[0].name + "'"); }
      catch (e) { resPrev.replaceChildren(el("p", { class: "bad", text: e.message })); }
    });
    // 자동 보관본(최근 10개)
    async function drawSnaps() {
      const list = await Server.snapshots();
      fill(snapBox, list.length ? table(["시각", "종류", "싱크", "단어장", "사용자", ""], list.map(sn => {
        const dl = el("button", { type: "button", class: "small-btn", text: "받기" }), rb = el("button", { type: "button", class: "small-btn", text: "복구" });

        rb.addEventListener("click", async () => { previewRestore(await Server.snapshot(sn.id), "자동 보관본 " + sn.id + "번(" + sn.kind + ")"); resPrev.scrollIntoView({ block: "start" }); });

      el("h3", { text: "서버로 올리기 (4단계 브라우저 데이터 → 서버)" }), upBox,
      el("h3", { text: "서버 복구" }), el("label", { for: "res-file", text: "서버 백업 JSON 선택" }), resIn, resPrev,
