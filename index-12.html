  /* =========================================================
   * 9. 임베드 시험표 (시험용 — 7단계에서 정리)
   * ========================================================= */
  function renderEmbedTest() {
    const songs = Repo.getSongs().filter(s => s.status === "ready");
    const playerBox = el("div", { class: "test-player", hidden: true }, [el("div", { id: "yt-test" })]);
    const progress = el("p", { class: "small", role: "status" });
    const tbody = el("tbody");
    const buttons = [];
    let running = false;

    function row(s) {
      const d = Diag.get(s.id);
      const dur = fmtSec(Repo.getSong(s.id).durationSec);
      let result;
      if (!s.videoUrl) result = el("span", { class: "need", text: "영상 링크 입력 필요" });
      else if (!d) result = el("span", { class: "muted", text: "아직 확인 안 함" });
      else if (d.result === "오류") result = el("span", { class: "bad", text: "안 됨 — 오류 " + d.code + ": " + (YT_ERRORS[d.code] || "") });
      else if (d.result === "재생됨") result = el("span", { class: "ok", text: "재생됨" });
      else result = el("span", { class: "need", text: d.result });
      const btn = el("button", { type: "button", text: "시험", disabled: !s.videoUrl || !youtubeId(s.videoUrl) });
      btn.addEventListener("click", () => runTests([s]));
      buttons.push(btn);
      return el("tr", { id: "et-" + s.id }, [
        el("td", { class: "num", text: String(s.id) }),
        el("td", { lang: "vi", text: s.title }),
        el("td", null, [result]),
        el("td", { class: "num" }, [dur ? el("span", { text: dur }) : el("span", { class: "need", text: "영상 길이 확인 필요" })]),
        el("td", { class: "small", text: d && d.checkedAt ? new Date(d.checkedAt).toLocaleString("ko-KR") : "" }),
        el("td", null, [btn])
      ]);
    }
    function redraw() { buttons.length = 0; tbody.replaceChildren.apply(tbody, songs.map(row)); allBtn.disabled = running; buttons.forEach(b => { if (running) b.disabled = true; }); }

    function testOne(YT, s) {
      return new Promise(resolve => {
        playerBox.hidden = false;
        playerBox.replaceChildren(el("div", { id: "yt-test" }));
        let done = false, player = null;
        const finish = async (patch) => {
          if (done) return; done = true;
          clearTimeout(timer);
          const d = player && player.getDuration ? player.getDuration() : 0;
          if (d > 0) {
            patch.durationSec = d;
            if (Repo.getSong(s.id).durationSec !== d) { try { await Repo.updateSong(s.id, { durationSec: d }); } catch (e) {} }
          }
          await Diag.record(s.id, patch);
          try { player && player.destroy(); } catch (e) {}
          activePlayers = activePlayers.filter(p => p !== player);
          resolve();
        };
        const timer = setTimeout(() => finish({ result: "자동 재생 확인 안 됨 — 학습 화면에서 직접 재생해 확인", code: null }), 20000);
        player = new YT.Player("yt-test", {
          videoId: youtubeId(s.videoUrl),
          playerVars: { playsinline: 1, rel: 0, mute: 1, autoplay: 1 },
          events: {
            onReady: e => { e.target.mute(); e.target.playVideo(); },
            onStateChange: e => { if (e.data === YT.PlayerState.PLAYING) { e.target.pauseVideo(); finish({ result: "재생됨", code: null }); } },
            onError: e => finish({ result: "오류", code: e.data })
          }
        });
        activePlayers.push(player);
      });
    }

    async function runTests(list) {
      if (running) return;
      running = true; redraw();
      let YT;
      try { YT = await loadYouTubeApi(); }
      catch (e) { progress.textContent = e.message + ". 인터넷 연결을 확인하세요."; running = false; redraw(); return; }
      for (let i = 0; i < list.length; i++) {
        if (location.hash !== "#/embed-test") break;
        progress.textContent = (i + 1) + "/" + list.length + " 시험 중: " + list[i].id + "번 " + list[i].title;
        await testOne(YT, list[i]);
        redraw();
      }
      playerBox.hidden = true;
      progress.textContent = "시험을 마쳤습니다.";
      running = false; redraw();
    }

    const allBtn = el("button", { class: "primary", type: "button", text: "전체 순서대로 시험" });
    allBtn.addEventListener("click", () => runTests(songs.filter(s => s.videoUrl && youtubeId(s.videoUrl))));

    setView([
      el("h2", { text: "임베드 시험표" }),
      el("p", { class: "hint", text: "시험용 화면입니다(7단계에서 정리). [시험]을 누르면 소리 없이 잠깐 재생해 보고, 재생 여부와 영상 길이를 기록합니다. 학습 화면에서 영상을 재생해도 기록됩니다." }),
      el("div", { class: "row-actions" }, [allBtn]),
      progress, playerBox,
      el("div", { class: "table-wrap" }, [el("table", null, [
        el("thead", null, [el("tr", null, ["ID", "곡명", "임베드 재생", "저장된 영상 길이", "확인 시각", ""].map(h => el("th", { text: h })))]),
        tbody
      ])])
    ], "embed");
    redraw();
    window.scrollTo(0, 0);
  }

  /* =========================================================
   * 10. 화면 전환 + 메뉴(역할별). 화면 숨김은 편의일 뿐, 실제 권한은 서버 규칙이 막는다.
   * ========================================================= */
  // 메뉴 숫자: 학습자 = 새 피드백 수, 교사·관리자 = 피드백 안 한 제출 수. 로그인·화면 이동 때 다시 센다.
  const navCounts = { newFeedback: 0, toReview: 0, assign: 0, pending: 0 };
  async function refreshNavCounts() {
    if (!Server.profile()) { navCounts.newFeedback = 0; navCounts.toReview = 0; return; }
    try {
      const mine = await Server.mySubmissions();
      navCounts.newFeedback = mine.filter(s => s.feedback_at && (!s.seen_at || s.seen_at < s.feedback_at)).length
        + (await Server.myOverall().catch(() => [])).filter(o => !o.seen_at || o.seen_at < o.feedback_at).length;
      navCounts.toReview = Server.canTeach() ? (await Server.listSubmissions(null)).filter(s => !s.feedback_at).length : 0;
      navCounts.assign = (await Server.myAssignments()).filter(a => Object.values(a.progress || {}).some(v => !v.done)).length;
      navCounts.pending = Server.isAdmin() ? (await Server.profiles()).filter(u => u.learner_status === "pending").length : 0;
    } catch (e) { /* 숫자만 못 셈 */ }
    renderNav();
  }
  // 학습자 큰 메뉴() + 작은 메뉴. 교사·관리자 메뉴는 그 아래 묶음.
  function renderNav() {
    const nav = document.getElementById("mainNav"), box = document.getElementById("userBox"), tab = document.getElementById("tabBar");
    const p = Server.profile();
    const cnt = n => n ? " (" + n + ")" : "";
    const kids = [];
    const big = (href, key, label, sub, group) => el("a", { href, "data-nav": key, "data-group": group || null, class: "big-item" }, [NAV_ICON[key] ? el("span", { class: "chick has-ico", "aria-hidden": "true" }, [stk(NAV_ICON[key], "nav-ico")]) : el("span", { class: "chick", "aria-hidden": "true", text: "✦" }),
      el("span", { class: "bi-text" }, [el("span", { class: "bi-label", text: label }), sub ? el("span", { class: "bi-sub", text: sub }) : null].filter(Boolean))]);
    const small = (href, key, label, group) => el("a", { href, "data-nav": key, "data-group": group, class: "sub-item", text: label });
    const tool = (href, key, label) => el("a", { href, "data-nav": key, class: "tool-item", text: label });
    if (Server.noProfile()) kids.push(big("#/songs", "list", "곡 목록"));
    else if (!p) {
      // 13단계: 로그인 전에는 메뉴가 보이되 잠겨 있다(🔒, 눌러도 움직이지 않음)
      const locked = (label, sub) => el("span", { class: "big-item locked", "aria-disabled": "true", title: "로그인 후 이용할 수 있습니다" }, [el("span", { class: "chick", "aria-hidden": "true", text: "🔒" }),
        el("span", { class: "bi-text" }, [el("span", { class: "bi-label", text: label }), el("span", { class: "bi-sub", text: sub })])]);
      void locked; // 14단계: 로그인 전에는 왼쪽 메뉴를 아예 보이지 않는다(로그인하면 나타남)
    }
    else if (!isActive(p)) kids.push(big("#/", "pending", "가입 승인 대기", "관리자 승인 후 사용"));
    else if (teacherMode()) {
      kids.push(
        big("#/t", "t-home", "반 현황", "출석 · 접속 · 할 일"),
        big("#/t/attendance", "t-att", "출석 현황", "날짜별 도장"),
        big("#/t/progress", "t-prog", "학습 현황", "핵심 단어 · 녹음"),
        big("#/assign", "assign", "과제" + cnt(navCounts.toReview), "녹음 과제", "tassign"),
        small("#/assign", "assign", "과제 내기 · 제출 현황", "tassign"), small("#/submissions", "submissions", "제출된 녹음 듣기 · 피드백" + cnt(navCounts.toReview), "tassign"),
        big("#/classes", "classes", "반 관리", "반 코드 · 학생 명단"),
        big("#/glossary", "glossary", "단어장", "핵심 단어 뜻"),
        big("#/board", "board", "열린 게시판", "반 글 보기"));
      if (Server.isAdmin()) kids.push(el("p", { class: "nav-title", text: "관리자" }), tool("#/admin/users", "admin-users", "학생·사용자 관리" + cnt(navCounts.pending)),
        tool("#/learn", "list", "곡 목록 · 가사 넣기"), tool("#/admin/weeks", "admin-weeks", "주차별 곡 관리"), tool("#/add", "add", "곡 추가"), tool("#/settings", "settings", "설정"),
        tool("#/admin/data", "admin-data", "서버 데이터"), tool("#/embed-test", "embed", "임베드 시험표"));
      const sw = el("button", { type: "button", class: "mode-btn" }, [el("span", { class: "lbl", text: "학생 화면으로 보기" })]);
      sw.addEventListener("click", () => { viewAsLearner = true; renderNav(); location.hash = "#/checkin"; });
      kids.push(sw);
    }
    else {
      kids.push(
        big("#/checkin", "checkin", "출석 체크", "오늘의 도장"),
        big("#/learn", "list", "전체 곡", "곡 목록 · 검색"),
        big("#/weeks", "weeks", "주차별 학습", "1~15주차 한 주 한 곡"),
        big("#/practice", "practice", "연습하기", "반복 · 단어 · 녹음", "practice"),
        small("#/practice/pick/repeat", "practice-repeat", "한 줄 반복 연습", "practice"), small("#/practice/pick/words", "practice-words", "핵심 단어 연습", "practice"),
        small("#/practice/pick/sing", "practice-sing", "따라 부르기 녹음", "practice"), small("#/vault", "vault", "녹음 보관함", "practice"), small("#/review", "review", "오늘의 복습", "practice"),
        big("#/assignments", "assignments", "과제" + cnt(navCounts.assign), "녹음 과제", "assign"),
        small("#/assignments", "assignments", "이번 주 과제", "assign"), small("#/submit", "submit", "과제 제출" + cnt(navCounts.newFeedback), "assign"),
        big("#/me", "me", "마이페이지", "나의 정보 · 피드백"),
        big("#/board", "board", "열린 게시판", "반 친구와 이야기"));
      if (Server.canTeach()) {
        const sw = el("button", { type: "button", class: "mode-btn" }, [el("span", { class: "lbl", text: "교수자 화면으로" })]);
        sw.addEventListener("click", () => { viewAsLearner = false; renderNav(); location.hash = "#/t"; });
        kids.push(sw);
      }
    }
    if (p) kids.push(el("div", { class: "nav-sticker", id: "navSticker" }, [stk(PAGE_STK[document.body.dataset.route] || "c_headphones")]));
    nav.replaceChildren(...kids);
    document.body.classList.toggle("anon", !p && !Server.noProfile());
    nav.dataset.group = navGroupOf(document.body.dataset.route);
    // 휴대폰 아래 탭: 출석 · 학습하기 · 연습하기 · 과제 + [더 보기]
    const quick = p && teacherMode() ? [["#/t", "t-home", "반 현황"], ["#/t/attendance", "t-att", "출석"], ["#/t/progress", "t-prog", "학습 현황"], ["#/assign", "assign", "과제"]]
                : p ? [["#/checkin", "checkin", "출석"], ["#/weeks", "weeks", "주차별"], ["#/practice", "practice", "연습하기"], ["#/assignments", "assignments", "과제" + cnt(navCounts.assign)]]
                    : [["#/", "cover", "처음"], ["#/login", "login", "학생 로그인"], ["#/login/teacher", "login-t", "교수자"]];
    const more = el("button", { type: "button", "aria-pressed": "false", "aria-controls": "mainNav", text: "더 보기" });
    more.addEventListener("click", () => { const on = document.body.classList.toggle("more-open"); more.setAttribute("aria-pressed", String(on)); });
    tab.style.gridTemplateColumns = "repeat(" + (quick.length + 1) + ", minmax(0, 1fr))";
    tab.replaceChildren(...quick.map(([href, key, label]) => el("a", { href, "data-nav": key, text: label })), more);
    const cur = document.body.dataset.route;
    document.querySelectorAll("#mainNav a, #tabBar a").forEach(a => { if (a.dataset.nav === cur) a.setAttribute("aria-current", "page"); });
    // 위쪽: 곡 검색 + 인사 + 로그아웃
    const out = el("button", { type: "button", text: "로그아웃" });
    out.addEventListener("click", async () => { out.disabled = true; await Server.signOut(); await afterSignOut(); });
    if (p) {
      const prevQ = document.getElementById("top-search"), typing = prevQ && document.activeElement === prevQ;
      const q = el("input", { type: "search", id: "top-search", placeholder: "곡명·가수 검색", "aria-label": "곡 검색", value: prevQ ? prevQ.value : songQuery });
      q.addEventListener("keydown", ev => { if (ev.key === "Enter") { songQuery = q.value.trim(); location.hash = "#/learn"; route(); } });
      if (typing) setTimeout(() => { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }, 0);
      box.replaceChildren(el("div", { class: "top-search" }, [q]), el("span", { class: "hello" }, [el("span", { text: "안녕하세요, " + p.display_name + "님" }), el("span", { class: "small muted", text: p.display_name + " · " + ROLE_LABEL(p) })]), out);
    }
    else if (Server.noProfile()) box.replaceChildren(el("span", { text: (Server.user().email || "") + " · 계정 정보 없음" }), out);
    else {
      const lg = el("button", { type: "button", class: "primary small-btn", text: "로그인" });
      lg.addEventListener("click", () => { const n = document.getElementById("c-login"); if (n) n.scrollIntoView({ behavior: "smooth", block: "start" }); else location.hash = "#/login"; });
      box.replaceChildren(el("div", { class: "login-btns" }, [lg]));
    }
  }
  let songQuery = "";
  let currentRoute = null;
  function route() {
    if (currentRoute === "list") listScrollY = window.scrollY;
    const h = location.hash || "#/";
    const loggedIn = !!Server.profile();
    const need = (cond, msg) => { if (cond) return true; setView([el("h2", { text: "권한 없음" }), el("p", { class: "bad", text: msg })], ""); return false; };
    const login = () => { if (loggedIn) return true; loginNext = h; currentRoute = "login"; renderLogin("로그인이 필요합니다."); return false; };
    let m;
    if (Server.noProfile()) { currentRoute = "noprofile"; renderNoProfile(); return; }
    teacherLogin = h === "#/login/teacher";
    // 13단계: 로그인하지 않았으면 표지 · 로그인 화면만. 다른 주소는 표지로 돌려보낸다.
    if (!loggedIn && !/^#\/(login(\/teacher)?|signup)?$/.test(h)) {
      lockNotice = true; history.replaceState(null, "", location.pathname + location.search + "#/");
      currentRoute = "cover"; renderCover(); return;
    }
    if (h === "#/login/teacher") { if (loggedIn) { location.hash = "#/"; return; } currentRoute = "login"; renderLogin(); return; }
    if (Server.profile()) startPresence(); // 로그인·가입·승인 확인 어느 경로로 들어와도 접속 신호 시작(한 번만)
    if (Server.profile() && (!Server.profile().privacy_ack_at || Server.profile().privacy_ack_at < new Date(PRIVACY_REVISED_AT).toISOString())) { currentRoute = "privacy"; renderPrivacyNotice(); return; } // 첫 로그인(구글 포함)·바뀐 안내 확인
    if (Server.profile() && !isActive(Server.profile())) { currentRoute = "pending"; renderPending(); return; } // 가입 승인 대기·거부
    if (Server.profile() && currentRoute !== null) refreshNavCounts();
    if (h === "#/login") { currentRoute = "login"; renderLogin(); }
    else if ((m = h.match(/^#\/status\/([0-9a-f-]{36})$/))) { if (login() && need(Server.canTeach(), "관리자와 승인된 교사만 다른 사람의 학습 현황을 볼 수 있습니다(내 현황은 [내 정보·진도]).")) { currentRoute = "status"; renderStatusPage(m[1]); } }
    else if ((m = h.match(/^#\/song\/(\d+)$/))) { if (login()) { currentRoute = "song"; renderSong(Number(m[1])); } }
    else if ((m = h.match(/^#\/song\/(\d+)\/sing\/([\w-]+)$/))) { if (login()) { currentRoute = "song"; practiceSong = Number(m[1]); renderSong(Number(m[1]), { singLineId: m[2], singOnly: true }); } }
    else if ((m = h.match(/^#\/words\/(\d+)$/))) { if (login()) { currentRoute = "words"; renderWords(Number(m[1])); } }
    else if (h === "#/t") { if (login() && need(Server.canTeach(), "교수자만 볼 수 있습니다.")) { currentRoute = "t-home"; renderTeachHome(); } }
    else if (h === "#/t/attendance") { if (login() && need(Server.canTeach(), "교수자만 볼 수 있습니다.")) { currentRoute = "t-att"; renderTeachAttendance(); } }
    else if (h === "#/t/progress") { if (login() && need(Server.canTeach(), "교수자만 볼 수 있습니다.")) { currentRoute = "t-prog"; renderTeachProgress(); } }
    else if (h === "#/weeks") { if (login()) { currentRoute = "weeks"; renderWeeks(); } }
    else if (h === "#/admin/weeks") { if (login() && need(Server.isAdmin(), "관리자만 주차별 곡을 정할 수 있습니다.")) { currentRoute = "admin-weeks"; renderAdminWeeks(); } }
    else if (h === "#/checkin") { if (login()) { currentRoute = "checkin"; renderCheckin(); } }
    else if (h === "#/learn") { if (login()) { currentRoute = "list"; renderList(); } }
    else if (h === "#/practice" || (m = h.match(/^#\/practice\/pick\/(repeat|words|sing)$/))) {
      if (login()) { currentRoute = "practice"; const sid = defaultPracticeSong(); const tb = m ? m[1] : "words";
        if (sid) location.replace("#/practice/" + sid + "/" + tb); else renderPracticePick(tb); } }
    else if (h === "#/practice/songs") { if (login()) { currentRoute = "practice"; renderPracticePick(); } }
    else if (h === "#/vault") { if (login()) { currentRoute = "vault"; renderVault(); } }
    else if (h === "#/submit") { if (login()) { currentRoute = "submit"; renderSubmit(); } }
    else if ((m = h.match(/^#\/practice\/(\d+)(?:\/(repeat|words|sing))?$/))) { if (login()) { currentRoute = "practice"; renderPracticeHub(Number(m[1]), m[2] || "words"); } }
    else if (h === "#/board") { if (login()) { currentRoute = "board"; renderBoard(); } }
    else if ((m = h.match(/^#\/board\/([0-9a-f-]{36})$/))) { if (login()) { currentRoute = "board"; renderBoardPost(m[1]); } }
    else if ((m = h.match(/^#\/practice\/(\d+)\/(flash|meaning|blank|tone|game)$/))) { if (login()) { currentRoute = "practice"; renderPractice(Number(m[1]), m[2]); } }
    else if (h === "#/review") { if (login()) { currentRoute = "review"; renderReview(); } }
    else if (h === "#/me") { if (login()) { currentRoute = "me"; renderMe(); } }
    else if (h === "#/recordings") { if (login()) { currentRoute = "recordings"; renderRecordings(); } }
    else if (h === "#/popular") { if (login()) { currentRoute = "popular"; renderPopular(); } }
    else if (h === "#/submissions") { if (login() && need(Server.canTeach(), "승인된 교사와 관리자만 볼 수 있습니다.")) { currentRoute = "submissions"; renderSubmissions(); } }
    else if (h === "#/classes") { if (login()) { currentRoute = "classes"; renderClasses(); } }
    else if ((m = h.match(/^#\/class\/([0-9a-f-]{36})$/))) { if (login() && need(Server.canTeach(), "승인된 교사만 볼 수 있습니다.")) { currentRoute = "class"; renderClassDetail(m[1]); } }
    else if (h === "#/add") { if (login() && need(Server.isAdmin(), "곡 추가는 관리자만 할 수 있습니다.")) { currentRoute = "add"; renderAdd(); } }
    else if ((m = h.match(/^#\/fill\/(\d+)$/))) { if (login() && need(Server.isAdmin(), "가사·영상 넣기는 관리자만 할 수 있습니다.")) { currentRoute = "fill"; renderFill(Number(m[1])); } }
    else if (h === "#/assignments") { if (login()) { currentRoute = "assignments"; renderAssignments(); } }
    else if (h === "#/assign") { if (login() && need(Server.canTeach(), "승인된 교사와 관리자만 과제를 낼 수 있습니다.")) { currentRoute = "assign"; renderAssignManage(); } }
    else if ((m = h.match(/^#\/assign\/([0-9a-f-]{36})$/))) { if (login() && need(Server.canTeach(), "승인된 교사와 관리자만 볼 수 있습니다.")) { currentRoute = "assign"; renderAssignDetail(m[1]); } }
    else if (h === "#/glossary") { if (login() && need(Server.canTeach(), "단어장은 승인된 교사와 관리자만 고칠 수 있습니다.")) { currentRoute = "glossary"; renderGlossary(); } }
    else if (h === "#/settings") { if (login() && need(Server.isAdmin(), "전체 설정은 관리자만 바꿀 수 있습니다.")) { currentRoute = "settings"; renderSettings(); } }
    else if (h === "#/admin/users") { if (login() && need(Server.isAdmin(), "관리자만 볼 수 있습니다.")) { currentRoute = "admin-users"; renderAdminUsers(); } }
    else if (h === "#/admin/data" || h === "#/data") { if (login() && need(Server.isAdmin(), "관리자만 볼 수 있습니다.")) { currentRoute = "admin-data"; renderData(); } }
    else if (h === "#/embed-test") { if (login() && need(Server.isAdmin(), "관리자만 볼 수 있습니다.")) { currentRoute = "embed"; renderEmbedTest(); } }
    else if (h === "#/signup") { currentRoute = "login"; loginRole = "learner"; renderLogin(); const n = document.getElementById("s-name"); if (n) { n.scrollIntoView({ block: "center" }); n.focus(); } }
    else if (h === "#/songs") { currentRoute = "list"; renderList(); }
    else if (!loggedIn) { currentRoute = "cover"; renderCover(); }
    else if (teacherMode()) { currentRoute = "t-home"; renderTeachHome(); } // 교수자 첫 화면 = 반 현황
    else if (Server.profile().role === "learner" || viewAsLearner) { currentRoute = "checkin"; renderCheckin(); } // 학습자 첫 화면 = 출석 체크
    else { currentRoute = "list"; renderList(); }
  }

  (async function start() {
    const ok = await Server.init();
    if (OAUTH_RETURN) {
      history.replaceState(null, "", location.pathname + location.search + (OAUTH_RETURN.error ? "#/login" : "#/"));
      if (OAUTH_RETURN.error) oauthError = "구글 로그인이 완료되지 않았습니다(" + OAUTH_RETURN.error + "). 다시 눌러 주세요.";
    }
    try {
      if (ok && Server.user() && Server.profile()) await loadUserData();
      else if (ok && Server.user()) Settings.useDefaults(); // 프로필 없는 계정: 로그인은 유지하고 안내 화면을 보여준다
      else { if (ok) await Repo.initPublic(); Settings.useDefaults(); }
    } catch (e) {
      Settings.useDefaults();
      if (!(e instanceof OfflineError)) { const b = document.getElementById("storageBanner"); b.textContent = "데이터를 불러오지 못했습니다: " + e.message; b.hidden = false; }
    }
    await Diag.init();
    Server.onAuth(ev => { if (ev === "SIGNED_OUT") afterSignOut(); });
    renderNav();
    window.addEventListener("hashchange", route);
    // 지금 보고 있는 화면의 메뉴를 다시 누르면 새로 불러온다(같은 주소라 hashchange가 없으므로)
    document.addEventListener("click", ev => {
      const a = ev.target.closest && ev.target.closest("#mainNav a, #tabBar a");
      if (a && a.getAttribute("href") === (location.hash || "#/")) { ev.preventDefault(); route(); }
    });
    route();
    if (Server.profile()) { refreshNavCounts(); startPresence(); }
  })();

  // 코드 검사용(화면에는 영향 없음)
  window.__nbv = { Server: Server, Progress: Progress, UploadKit: UploadKit, KeyWords: KeyWords, Learner: Learner, blankedLine: blankedLine, Settings: Settings, Analysis: Analysis, VocabEngine: VocabEngine, Repo: Repo, parseLyrics: parseLyrics, parseSimpleLyrics: parseSimpleLyrics, canonicalVideoUrl: canonicalVideoUrl, youtubeId: youtubeId };
})();
</script>
