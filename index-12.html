<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>노래로 배우는 베트남어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&family=Be+Vietnam+Pro:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #FBF1E8; --glow: #FFFDF9; --yellow: #FCC257; --yellow-soft: #FDE3AE; --amber: #8F5A00;
    --ink: #1A1714; --gray: #5C554D; --white: #FFFFFF;
    --bg: var(--cream); --fg: var(--ink); --muted: var(--gray); --line: #E6D6C2; --soft: #F6EADB;
    --accent: var(--amber); --bad: #9E1F14; --warn: var(--amber); --ok: #1B5E32;
    --s4: 4px; --s8: 8px; --s12: 12px; --s17: 17px; --s24: 24px; --s32: 32px; --s48: 48px; --s80: 80px;
    --r-card: 18px; --r-btn: 8px;
    --shadow: 0 6px 18px rgba(143, 90, 0, 0.08); /* 영상 썸네일·정보 배지에만 */
    --font-ko: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    --font-head: "Noto Sans KR", system-ui, -apple-system, sans-serif; /* 제목은 Windows에서도 900이 나오게 Noto Sans KR 먼저 */
    --font-vi: "Be Vietnam Pro", system-ui, -apple-system, sans-serif;  /* 베트남어 성조 부호 전용 */
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; color: var(--fg);
    /* 허용된 배경 그라데이션 한 가지: 크림 → 연한 노랑(왼쪽 위에 은은한 빛) */
    background: radial-gradient(ellipse at 12% 0%, var(--glow) 0%, var(--cream) 40%, #FCEBD2 100%) fixed;
    font-family: var(--font-ko);
    font-size: 17px; font-weight: 400; line-height: 1.47;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  header {
    background: transparent;
    border-bottom: 1px solid var(--line);
    padding: env(safe-area-inset-top, 0px) var(--s24) 0;
  }
  header > * { max-width: 1200px; margin-left: auto; margin-right: auto; }
  .brand-link { color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; min-height: 44px; }
  header h1 { font-family: var(--font-head); font-size: 20px; font-weight: 900; letter-spacing: -0.02em; margin: 8px 0 4px; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; padding-bottom: 6px; }
  nav a {
    flex: 0 0 auto; display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px;
    color: var(--fg); text-decoration: none; border: 1px solid var(--line); border-radius: 6px; font-size: 15px;
  }
  nav a { border-color: transparent; }
  nav a[aria-current="page"] { background: var(--yellow); border-color: var(--yellow); color: var(--ink); font-weight: 700; color: var(--on-accent);}
  main { max-width: 860px; margin: 0 auto; padding: var(--s17) var(--s24) var(--s48); }
  body[data-route="list"] main, body[data-route="cover"] main { max-width: 1200px; }
  h2 { font-family: var(--font-head); font-size: 28px; font-weight: 900; letter-spacing: -0.02em; margin: 4px 0; }
  h3 { font-family: var(--font-head); font-weight: 700; }
  [lang="vi"] { font-family: var(--font-vi); letter-spacing: 0; }
  a { color: var(--ink); }
  h3 { font-size: 17px; margin: 20px 0 8px; }
  button, .btn {
    min-height: 44px; min-width: 44px; padding: 0 14px; font-size: 16px; font-family: inherit;
    border: 1px solid var(--line); border-radius: var(--r-btn); background: var(--white); color: var(--fg);
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
    transition: transform .12s;
  }
  button:active, .btn:active, nav a:active { transform: scale(0.95); } /* 눌림 효과는 이것 하나 */
  button:focus-visible, .btn:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  button.primary, .btn.primary { background: var(--yellow); border-color: var(--yellow); color: var(--ink); font-weight: 700; border-radius: 999px; padding: 0 var(--s24); color: var(--on-accent);}
  button:disabled { opacity: .5; cursor: not-allowed; }
  .banner { padding: 10px 12px; margin: 8px 12px 0; border: 1px solid var(--bad); color: var(--bad); border-radius: 6px; }
  /* 5단계 */
  .top-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 8px; padding-top: 4px; }
  .top-row h1 { margin: 4px 0; }
  .user-box { display: flex; align-items: center; gap: 6px; margin-left: auto; color: var(--muted); font-size: 13px; }
  .user-box button { min-height: 44px; font-size: 14px; padding: 0 10px; }
  .next-line { font-weight: 700; background: #fff4c2; border-left: 4px solid #e0a800; padding: 8px 10px; margin: 8px 0; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin: 8px 0; }
  .stat { border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; }
  .stat strong { font-size: 18px; }
  .cards { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .card p { margin: 2px 0; }
  .card-title { font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
  .card-title a { display: inline-flex; align-items: center; min-height: 44px; }
  .kv { list-style: none; padding: 0; margin: 4px 0; }
  .kv li { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dashed var(--line); padding: 3px 0; overflow-wrap: anywhere; }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
  .filters label { margin: 0; font-size: 13px; font-weight: 400; }
  .card .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .card .acts select { width: auto; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin: 6px 0; }
  .cal-h { text-align: center; font-size: 13px; color: var(--muted); }
  .cal-c { border: 1px solid var(--line); border-radius: 4px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cal-c.empty { border: none; }
  .cal-c.on { background: #e3f2e7; border-color: var(--ok); }
  .cal-c.today { outline: 2px solid var(--accent); }
  .cal-d { font-size: 13px; }
  .cal-s { font-size: 12px; color: var(--ok); font-weight: 700; }
  .badge-word { border: 1px solid var(--line); border-radius: 12px; padding: 2px 10px; color: var(--muted); }
  .badge-word.got { border-color: var(--ok); color: var(--ok); font-weight: 700; }
  .fb-box { border-left: 4px solid var(--ok); background: var(--soft); padding: 6px 8px; margin: 6px 0; }
  .fb-box.new { border-left-color: var(--accent); background: #eaf1fa; }
  .card.pending { border-color: var(--warn); }
  .sub-yt { position: relative; width: 100%; max-width: 360px; aspect-ratio: 16/9; background: #000; }
  .sub-yt > div, .sub-yt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .rank { color: var(--accent); }
  .title-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; justify-content: space-between; }
  .title-row h2 { flex: 1 1 auto; }
  .fav-mark { color: var(--bad); font-size: 16px; }
  .tag.scope { color: var(--accent); border-color: var(--accent); }
  .privacy { border: 1px solid var(--line); background: var(--soft); padding: 8px 10px; border-radius: 6px; margin-top: 12px; }
  .privacy p { margin: 2px 0; }
  .strong { font-weight: 700; }
  .class-code { font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; letter-spacing: 2px; }
  .class-code.big { font-size: 22px; }
  td.acts { display: flex; flex-wrap: wrap; gap: 4px; }
  td.acts select { width: auto; }
  .fb-cell { min-width: 220px; }
  .fb-cell input { width: 100%; margin-bottom: 4px; }
  .rec-item { flex-wrap: wrap; }
  .banner-close { margin-left: 8px; min-height: 44px; }
  .compare tr.drop td { color: var(--bad); font-weight: 600; }
  .drop-warn { color: var(--bad); font-weight: 700; }
  .banner.info { border-color: var(--ok); color: var(--fg); background: #eef8f1; }
  .check { display: flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 400; }
  .check input { width: 22px; height: 22px; }
  .notice { padding: 10px 12px; margin: 8px 0; border-left: 4px solid var(--ok); background: var(--soft); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .need { color: var(--warn); }
  .bad { color: var(--bad); }
  .ok { color: var(--ok); }

  /* 곡 목록 */
  .summary { margin: 4px 0 12px; color: var(--muted); font-size: 14px; }
  .songs { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: var(--s17); }
  .songs li { min-width: 0; }
  .song { display: flex; flex-direction: column; gap: var(--s8); height: 100%; background: var(--white); border: 1px solid var(--line);
          border-radius: var(--r-card); padding: var(--s12); color: inherit; text-decoration: none; transition: transform .12s; }
  a.song:active { transform: scale(0.95); }
  .song .thumb { display: flex; align-items: center; justify-content: center; aspect-ratio: 16 / 9; border-radius: 12px; overflow: hidden;
                 background: var(--yellow); box-shadow: var(--shadow); color: var(--on-accent);}
  .song .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .ph { font-family: var(--font-vi); font-weight: 900; font-size: 40px; color: var(--ink); line-height: 1.4; }
  .song .body { display: block; min-width: 0; }
  .song .title { font-weight: 700; font-size: 18px; line-height: 1.4; overflow-wrap: anywhere; }
  .song .artist { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
  .song .tags { display: flex; flex-wrap: wrap; gap: var(--s4); align-items: center; margin-top: auto; }
  .song .tag { font-size: 14px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--white); }
  .song .tag.lv { border-color: transparent; }
  .song .num { font-size: 14px; color: var(--muted); }
  /* 준비 중: 투명도 대신 점선 테두리·옅은 바탕으로 흐리게(글자 대비는 그대로 4.5:1 이상) */
  .song.disabled { background: var(--soft); border-style: dashed; color: var(--muted); }
  .song.disabled .thumb { background: #EFE2D1; box-shadow: none; }
  .song.disabled .title { font-weight: 400; }
  @media (max-width: 640px) {
    .songs { grid-template-columns: 1fr; gap: var(--s8); }
    .song { flex-direction: row; align-items: center; }
    .song .thumb { flex: 0 0 112px; }
    .song .tags { margin-top: 0; }
  }
  /* 홈: 오늘의 추천곡(참고 이미지 배치) · 표지 공통 */
  .hero { display: grid; grid-template-columns: 1.05fr 1fr; gap: var(--s48); align-items: center; margin: var(--s24) 0 var(--s48);
          grid-template-areas: "text stage" "badges stage" "cta stage"; }
  .hero .h-text { grid-area: text; } .hero .h-badges { grid-area: badges; } .hero .h-cta { grid-area: cta; } .hero .h-stage { grid-area: stage; }
  .kicker { font-size: 15px; font-weight: 700; color: var(--gray); margin: 0 0 var(--s8); }
  .big { font-family: var(--font-head); font-size: 56px; font-weight: 900; line-height: 1.1; letter-spacing: -0.03em; margin: 0; word-break: keep-all; }
  .big[lang="vi"] { font-family: var(--font-vi); letter-spacing: 0; line-height: 1.4; }
  .spaced { margin: var(--s12) 0 0; color: var(--amber); font-weight: 700; font-size: 15px; letter-spacing: 0.3em; }
  .ibadges { display: grid; grid-template-columns: 1fr; gap: var(--s12); max-width: 420px; }
  .ibadge { display: flex; align-items: center; gap: var(--s12); background: var(--white); border-radius: var(--r-card); padding: var(--s12) var(--s17); box-shadow: var(--shadow); }
  .ibadge .ic { flex: 0 0 48px; height: 48px; border-radius: 50%; background: var(--yellow); display: flex; align-items: center; justify-content: center; color: var(--on-accent);}
  .ibadge .ic svg { width: 26px; height: 26px; }
  .ibadge strong { display: block; font-size: 18px; font-weight: 900; line-height: 1.3; word-break: keep-all; }
  .ibadge span { display: block; font-size: 14px; color: var(--gray); line-height: 1.35; word-break: keep-all; }
  .stage { position: relative; height: 460px; }
  .stage .sun { position: absolute; right: 0; top: 0; width: 88%; height: 92%; background: var(--yellow); border-radius: 260px 260px 32px 32px; color: var(--on-accent);}
  .stage .plinth { position: absolute; left: 6%; right: 0; bottom: 0; height: 110px; }
  .stage .plinth .side { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; background: var(--yellow); border-radius: 50%; border: 2px solid #E9A93A; color: var(--on-accent);}
  .stage .plinth .top { position: absolute; left: 0; right: 0; bottom: 20px; height: 78px; background: var(--yellow-soft); border-radius: 50%; border: 2px solid #F3D49A; }
  .stage .pic { position: absolute; left: 12%; right: 6%; bottom: 66px; aspect-ratio: 16 / 9; border-radius: var(--r-card); overflow: hidden;
                background: var(--yellow-soft); border: 2px solid var(--white); box-shadow: var(--shadow); display: flex; align-items: center; justify-content: center; }
  .stage .pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .stage .pic .ph { font-family: var(--font-vi); font-weight: 900; font-size: 72px; }
  .stage .sheet { position: absolute; left: 14%; right: 8%; bottom: 66px; height: 290px; background: var(--white); border-radius: var(--r-card);
                  transform: rotate(-4deg); box-shadow: var(--shadow); padding: 24px; }
  .stage .sheet svg { width: 100%; height: 100%; }
  .float { position: absolute; color: var(--ink); }
  .float svg { width: 100%; height: 100%; display: block; fill: var(--ink); }
  .float.n1 { width: 80px; height: 104px; left: 2%; top: 6%; animation: drift 11s ease-in-out infinite alternate; }
  .float.n2 { width: 60px; height: 78px; right: 6%; top: 2%; animation: drift 14s ease-in-out infinite alternate-reverse; }
  .float.n3 { width: 50px; height: 66px; left: 0; top: 52%; animation: drift 9s ease-in-out infinite alternate; animation-delay: -3s; }
  .float.n4 { width: 64px; height: 84px; right: 0; top: 40%; animation: drift 12s ease-in-out infinite alternate; animation-delay: -6s; }
  @keyframes drift { from { transform: translate(0, 0) rotate(-6deg); } to { transform: translate(14px, -22px) rotate(6deg); } }
  @media (prefers-reduced-motion: reduce) { .float { animation: none; } }
  .cover .ibadges { grid-template-columns: 1fr 1fr; max-width: 560px; }
  .cta-row { display: flex; flex-wrap: wrap; gap: var(--s12); align-items: center; }
  .cta-row .lead { width: 100%; margin: 0; font-weight: 700; }
  .cta-row .btn { border-radius: 999px; padding: 0 var(--s24); font-weight: 700; border: 2px solid var(--ink); background: transparent; }
  .cta-row .btn.primary { border-color: var(--yellow); background: var(--yellow); color: var(--on-accent);}
  @media (max-width: 1068px) { .big { font-size: 40px; } .stage { height: 400px; } }
  @media (max-width: 860px) {
    .hero { grid-template-columns: 1fr; gap: var(--s24); grid-template-areas: "text" "stage" "badges" "cta"; }
    .ibadges { grid-template-columns: 1fr 1fr; max-width: none; }
    .stage { height: 340px; overflow: hidden; border-radius: 32px; }
  }
  @media (max-width: 640px) { .big { font-size: 34px; } .stage { height: 280px; } .stage .sheet { height: 190px; } }
  @media (max-width: 419px) { .big { font-size: 28px; } .ibadges { gap: var(--s8); } .ibadge { padding: var(--s8); gap: var(--s8); }
    .ibadge .ic { flex-basis: 34px; height: 34px; } .ibadge .ic svg { width: 20px; height: 20px; } .ibadge strong { font-size: 15px; } .ibadge span { font-size: 14px; }
    .spaced { letter-spacing: 0.18em; } }
  .song.highlight { background: #fff8d6; }

  /* 학습 화면 */
  .artist-line { color: var(--muted); margin: 0 0 12px; overflow-wrap: anywhere; }
  .video { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; }
  .video > div, .video iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video-msg { border: 1px solid var(--line); padding: 12px; background: var(--soft); }
  .video-msg p { margin: 0 0 8px; }
  .meta { font-size: 13px; color: var(--muted); margin: 6px 0 0; }
  .lyrics { margin-top: 16px; }
  .line { display: grid; grid-template-columns: 32px 1fr; column-gap: 8px; padding: 6px 0; }
  .line.verse-start { margin-top: 22px; }
  .line:first-child.verse-start { margin-top: 0; }
  .line .no { color: var(--muted); font-size: 12px; text-align: right; padding-top: 3px; font-variant-numeric: tabular-nums; }
  .line .vi { font-size: 18px; margin: 0; overflow-wrap: anywhere; }
  .line .ko { font-size: 15px; color: #333; margin: 2px 0 0; overflow-wrap: anywhere; }
  .line .ts { font-size: 11px; color: var(--muted); margin-left: 6px; white-space: nowrap; }

  /* 폼 */
  label { display: block; font-weight: 600; margin: 14px 0 4px; }
  input[type=text], input[type=url], input[type=number], input[type=date], input[type=email], input[type=password], select, textarea {
    width: 100%; font-size: 16px; font-family: inherit; padding: 8px; min-height: 44px;
    border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--fg);
  }
  input[type=file] { display: block; width: 100%; min-height: 44px; padding: 10px 0; font-size: 16px; }
  textarea { min-height: 180px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
  .hint { font-size: 13px; color: var(--muted); margin: 4px 0 0; }
  .errors { color: var(--bad); margin: 8px 0; padding-left: 20px; }
  .warnings { color: var(--warn); margin: 8px 0; padding-left: 20px; }
  .table-wrap { overflow-x: auto; margin: 8px 0; border: 1px solid var(--line); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: var(--soft); white-space: nowrap; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row-actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
  .tabs button { border-radius: 6px 6px 0 0; border-bottom: none; background: var(--bg); }
  .tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; background: var(--soft); }
  /* 2단계: 어휘 수준 */
  .toggle[aria-pressed="true"] { border-color: var(--yellow); color: var(--ink); font-weight: 700; background: var(--yellow); color: var(--on-accent);}
  .pills { display: flex; flex-wrap: wrap; gap: var(--s8); margin: var(--s12) 0; }
  .pills button { border-radius: 999px; padding: 0 var(--s17); }
  .tag.lv { color: var(--fg); border-color: transparent; font-weight: 600; white-space: nowrap; }
  .lv0 { background: #e3f2e7; } .lv1 { background: #e6eef9; } .lv2 { background: #fdf0d9; } .lv3 { background: #f9e1df; }
  .vocab-box { margin-top: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
  .level-line { margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bar { display: flex; width: 100%; height: 14px; border-radius: 3px; overflow: hidden; background: var(--soft); }
  .seg { display: block; height: 100%; }
  .seg.s1, .sw.s1 { background: #b9d7f2; } .seg.s2, .sw.s2 { background: #6ea6dc; } .seg.s3, .sw.s3 { background: #e8a85a; } .seg.s4, .sw.s4 { background: #c0473f; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 12px; margin: 6px 0 0; }
  .lg { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .reason { margin: 6px 0 0; font-weight: 600; }
  .vi.stars { line-height: 1.4; }
  .vi.stars .syl { margin-bottom: 4px; }
  .syl { display: inline-flex; flex-direction: column; align-items: center; vertical-align: top; }
  .syl .st, .syl .tn { font-size: 12px; line-height: 1.3; color: var(--muted); white-space: nowrap; padding: 0 1px; }
  .syl .st { letter-spacing: -1px; }
  .syl.s3 .st { color: #b36b12; } .syl.s4 .st { color: var(--bad); }
  .syl.sx .w, .syl.sx .st { color: #9a9a9a; }
  .syl.ph .w { text-decoration: underline dotted; text-underline-offset: 3px; }
  .ex-line .vi, .ex-line .ko { color: #8a8a8a; }
  .ex-badge { display: inline-block; font-size: 12px; color: var(--warn); border: 1px solid var(--warn); border-radius: 10px; padding: 0 8px; margin: 4px 6px 0 0; }

  /* ===== 14단계: 파스텔 꿈나라 테마(솜사탕 분홍 · 라벤더 · 하늘 · 금빛) · 구름 버튼 · 꽉 찬 화면 ===== */
  :root {

      radial-gradient(circle at 12% 8%, rgba(195,228,247,.75) 0, rgba(195,228,247,0) 26%),

      radial-gradient(circle at 70% 90%, rgba(190,226,247,.65) 0, rgba(190,226,247,0) 30%),
      radial-gradient(circle at 20% 85%, rgba(186,230,253,.6) 0, rgba(186,230,253,0) 26%),
      linear-gradient(160deg, #FFE4F1 0%, #E3F0E6 45%, #E0F2FE 100%);

  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .7;
    background-image: radial-gradient(circle, rgba(255,255,255,.95) 0 1.2px, transparent 1.6px), radial-gradient(circle, rgba(250,204,21,.7) 0 1px, transparent 1.4px);
    background-size: 120px 120px, 190px 190px; background-position: 10px 20px, 60px 90px; }
  header, .layout, #tabBar { position: relative; z-index: 1; }
  ::selection { background: #F6C453; color: #1F3B5B; }
  a { color: #2B6CB0; }
  h1, h2, h3 { letter-spacing: -0.02em; color: var(--ink); }

<script>
/* ===== 어휘 수준 계산기 (index.html과 검증용 Node가 같은 코드를 쓴다) ===== */
var VocabEngine = (function () {
  "use strict";

  // 줄을 음절로 나눈다. 글자 덩어리 = 음절. 문장부호가 끼면 구간(seg)이 바뀌어 다음절 어휘가 맞춰지지 않는다.
  // parts: 원문을 빠짐없이 순서대로 나눈 조각(화면에서 원문을 한 글자도 바꾸지 않고 다시 그리기 위함).
  function tokenizeLine(text) {
    var s = String(text);
    var parts = [], tokens = [], seg = 0, m;
    var re = /[\p{L}\p{M}]+|[^\p{L}\p{M}]+/gu;
    while ((m = re.exec(s))) {
      var t = m[0];
      if (/^[\p{L}\p{M}]+$/u.test(t)) {
        var tok = { text: t, lower: t.normalize("NFC").toLowerCase(), seg: seg };
        tokens.push(tok);
        parts.push({ text: t, token: tok });
      } else {
        if (/[^\s]/.test(t)) seg++;
        parts.push({ text: t, token: null });
      }
    }
    return { parts: parts, tokens: tokens };
  }

  function normWord(w) { return String(w).normalize("NFC").trim().toLowerCase().replace(/\s+/g, " "); }

  // 기준 순위 = 두 목록 중 작은 순위. 목록 밖이면 null.
  function bestRank(word, vocab) {
    var r = vocab[word];
    if (!r) return null;
    var a = r[0], b = r[1];
    if (a == null) return b;
    if (b == null) return a;
    return Math.min(a, b);
  }

  function starOf(word, vocab, bounds) {
    var rank = bestRank(word, vocab);
    if (rank == null) return 4;
    if (rank <= bounds[0]) return 1;
    if (rank <= bounds[1]) return 2;
    if (rank <= bounds[2]) return 3;
    return 4;
  }

  // lyrics: [{lineNumber, vietnamese}] / settings: {bounds, weights, multiWords, excludeWords}
  // excludedLines: 이 곡에서 뺄 줄 번호 목록
  function analyzeSong(lyrics, vocab, settings, excludedLines) {
    var exWords = new Set((settings.excludeWords || []).map(normWord));
    var exLines = new Set(excludedLines || []);
    var phrases = (settings.multiWords || []).map(function (p) { return normWord(p).split(" "); })
      .filter(function (p) { return p.length > 1; })
      .sort(function (a, b) { return b.length - a.length; });
    var cnt = [0, 0, 0, 0, 0], excluded = 0, sung = 0;
    var lines = lyrics.map(function (l) {
      var tk = tokenizeLine(l.vietnamese);
      var lineEx = (l.lineId !== undefined && exLines.has(l.lineId)) || exLines.has(l.lineNumber);
      tk.tokens.forEach(function (t) {
        if (lineEx) { t.excluded = "line"; t.star = null; }
        else if (exWords.has(t.lower)) { t.excluded = "word"; t.star = null; }
        else { t.excluded = null; t.star = starOf(t.lower, vocab, settings.bounds); }
      });
      // 긴 어휘부터 맞춘다. 어휘 전체에 구성 음절 중 별이 가장 많은 수준을 적용한다.
      if (!lineEx) {
        for (var i = 0; i < tk.tokens.length; i++) {
          for (var p = 0; p < phrases.length; p++) {
            var ph = phrases[p];
            if (i + ph.length > tk.tokens.length) continue;
            var ok = true;
            for (var k = 0; k < ph.length; k++) {
              var t = tk.tokens[i + k];
              if (t.lower !== ph[k] || t.seg !== tk.tokens[i].seg || t.excluded) { ok = false; break; }
            }
            if (ok) {
              var st = 0;
              for (k = 0; k < ph.length; k++) st = Math.max(st, tk.tokens[i + k].star);
              for (k = 0; k < ph.length; k++) { tk.tokens[i + k].star = st; tk.tokens[i + k].phrase = ph.join(" "); }
              i += ph.length - 1;
              break;
            }
          }
        }
      }
      tk.tokens.forEach(function (t) { sung++; if (t.excluded) excluded++; else cnt[t.star]++; });
      return { lineNumber: l.lineNumber, excludedLine: lineEx, parts: tk.parts, tokens: tk.tokens };
    });
    var counted = cnt[1] + cnt[2] + cnt[3] + cnt[4];
    var pct = [0, 1, 2, 3, 4].map(function (i) { return counted ? cnt[i] / counted * 100 : 0; });
    var score = settings.weights[0] * pct[3] + settings.weights[1] * pct[4];
    return { counts: cnt, counted: counted, excluded: excluded, sung: sung, pct: pct, score: score,
             lineCount: lyrics.length, lines: lines };
  }

  // 표시와 동점 판정에 쓰는 점수(소수 첫째 자리)
  function roundScore(s) { return Math.round(s * 10) / 10; }

  // 순위 방식 사분위: 점수 낮은 순으로 순위 r(1부터)을 매기고 단계 = floor(4 × (r − 1) / N).
  // 동점(소수 첫째 자리까지 같은 점수)은 같은 순위(그중 가장 앞 순위)를 함께 쓴다 → 같은 단계.
  function assignLevels(items) {
    var n = items.length;
    var sorted = items.slice().sort(function (a, b) { return roundScore(a.score) - roundScore(b.score); });
    var out = new Map(), rank = 0, prev = null;
    sorted.forEach(function (it, idx) {
      var rs = roundScore(it.score);
      if (prev === null || rs !== prev) { rank = idx + 1; prev = rs; }
      out.set(it.id, { level: Math.floor(4 * (rank - 1) / n), rank: rank, n: n });
    });
    return out;
  }

  // 성조: 음절을 조합형(NFD)으로 풀어 성조 부호 5개만 찾는다.
  // ơ ư â ê ô ă의 뿔·모자·반달 부호(U+031B, U+0302, U+0306)와 đ는 성조가 아니므로 무시된다.

  }

  // 성조 부호만 뺀 형태(ơ ư â ê ô ă đ는 그대로). 같은 형태 = 성조만 다른 '비슷한 단어'.

  // 몫: ★★ 최대 opts.star2Max개 + ★★★ 최소 opts.star3Min개(합계 opts.max). 한쪽이 모자라면 다른 쪽으로 채운다.

  // opts.exclude(핵심 단어 제외 목록)는 선정에서만 뺀다. 제외 단어·제외 줄은 analyzeSong에서 이미 빠져 있다.

          if (okRun) { key = t.phrase; len = n; }

        if (!map[key]) map[key] = { key: key, star: t.star, count: 0, first: order++, lineIndex: li, lines: [] };
        map[key].count++;

    var hasMeaning = function (k) { return !!(glossary && glossary[k] && String(glossary[k]).trim()); };
    var all = Object.keys(map).map(function (k) { return map[k]; }).filter(function (w) { return !exclude[w.key]; });
    var byStar = function (s) {
      return all.filter(function (w) { return w.star === s && (s !== 4 || hasMeaning(w.key)); })
        .sort(function (a, b) { return b.count - a.count || a.first - b.first; });

  return { tokenizeLine: tokenizeLine, normWord: normWord, bestRank: bestRank, starOf: starOf,

})();

  "use strict";
  var LATER_SONG_FIELDS = ["videoNote", "spotifyUrl"];
  function seedLineId(songId, n) { return "s" + songId + "-" + n; }

    });

    function pushSong(s, visibility, ov) {

        release_date: s.releaseDate || null, video_url: s.videoUrl || null, video_note: s.videoNote || null, spotify_url: s.spotifyUrl || null,

    }
    seed.songs.forEach(function (s) {

                                               after: e.after === undefined ? null : e.after, at: e.at || null }); });

    if (st) {

      user: () => (session ? session.user : null),
      profile: () => profile,
      isAdmin: () => !!profile && profile.role === "admin",
      isTeacher: () => !!profile && profile.role === "teacher" && profile.teacher_status === "approved",
      canTeach: () => !!profile && (profile.role === "admin" || (profile.role === "teacher" && profile.teacher_status === "approved")),
      isPendingTeacher: () => !!profile && profile.role === "learner" && profile.teacher_status === "pending",
      async signUp(email, password, name, wantsTeacher) {
        const r = await run(c => c.auth.signUp({ email, password, options: { data: { display_name: name, wants_teacher: wantsTeacher ? "true" : "false", consent: "true" } } }));
        session = r.session || null;
        if (!session) throw new Error("가입은 되었지만 로그인되지 않았습니다. 관리자에게 'Confirm email' 설정을 확인해 달라고 하세요.");
        await loadProfile(); return profile;
      },
      // 구글 로그인: 구글 화면으로 갔다가 이 페이지로 돌아온다(돌아오면 init이 주소의 토큰을 읽어 로그인 상태가 된다)
      signInWithGoogle: () => run(c => c.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } })),

        const r = await run(c => c.auth.signInWithPassword({ email, password }));
        session = r.session; await loadProfile(); return profile;
      },
      async signOut() { try { await client.auth.signOut(); } catch (e) {} session = null; profile = null; },
      reloadProfile: loadProfile,
      async updateName(name) { await run(c => c.from("profiles").update({ display_name: name }).eq("id", session.user.id)); await loadProfile(); },

      // ---- 곡·가사
      publicSongs: () => all("songs", SONG_COLS, q => q.order("id")),

      // ---- 학습 기록(본인)
      myReview: () => all("review_items", "word,song_id,wrong,confused,first_at,last_at,schedule,done,example", q => q.eq("user_id", session.user.id)),
      upsertReview: (row) => run(c => c.from("review_items").upsert(Object.assign({ user_id: session.user.id }, row))),
      myPractice: () => all("practice_results", "song_id,kind,total,correct,at", q => q.eq("user_id", session.user.id)),
      addPractice: (row) => run(c => c.from("practice_results").insert(Object.assign({ user_id: session.user.id }, row))),
      myProgress: () => all("song_progress", "song_id,last_studied_at", q => q.eq("user_id", session.user.id)),

      myFavorites: () => all("favorites", "song_id", q => q.eq("user_id", session.user.id)),
      addFavorite: (songId) => run(c => c.from("favorites").insert({ user_id: session.user.id, song_id: songId })),
      removeFavorite: (songId) => run(c => c.from("favorites").delete().eq("user_id", session.user.id).eq("song_id", songId)),
      // ---- 녹음(본인만)
      myRecordings: () => all("recordings", "id,song_id,line_id,path,mime,size_bytes,created_at", q => q.eq("user_id", session.user.id).order("created_at")),
      async uploadRecording(blob, songId, lineId) {
        const mime = (blob.type || "audio/webm").split(";")[0];
        const ext = mime === "audio/mp4" ? "m4a" : mime === "audio/ogg" ? "ogg" : "webm";
        const path = session.user.id + "/" + Date.now() + "-" + Math.random().toString(36).slice(2, 7) + "." + ext;
        const clean = new Blob([blob], { type: mime }); // 'audio/webm;codecs=opus' → 'audio/webm' (버킷 허용 형식과 정확히 맞춘다)
        await run(c => c.storage.from("recordings").upload(path, clean, { contentType: mime, upsert: false }));
        try { return (await run(c => c.from("recordings").insert({ user_id: session.user.id, song_id: songId, line_id: lineId, path, mime, size_bytes: blob.size }).select("id,song_id,line_id,path,mime,size_bytes,created_at")))[0]; }
        catch (e) { try { await client.storage.from("recordings").remove([path]); } catch (x) {} throw e; }
      },
      async deleteRecording(rec) {
        await run(c => c.storage.from("recordings").remove([rec.path]));
        await run(c => c.from("recordings").delete().eq("id", rec.id));
      },

      // ---- 반
      myClasses: () => run(c => c.from("classes").select("id,name,code,teacher_id,archived,created_at").order("created_at")),
      myMemberships: () => run(c => c.from("class_members").select("class_id,joined_at").eq("user_id", session.user.id)),
      createClass: (name) => run(c => c.rpc("create_class", { p_name: name })),
      joinClass: (code) => run(c => c.rpc("join_class", { p_code: code })),
      leaveClass: (classId) => run(c => c.from("class_members").delete().eq("class_id", classId).eq("user_id", session.user.id)),
      roster: (classId) => run(c => c.rpc("class_roster", { p_class: classId })),
      removeMember: (classId, userId) => run(c => c.from("class_members").delete().eq("class_id", classId).eq("user_id", userId)),
      studentsReview: (ids) => ids.length ? all("review_items", "user_id,word,wrong,confused", q => q.in("user_id", ids)) : Promise.resolve([]),
      studentsPractice: (ids) => ids.length ? all("practice_results", "user_id,song_id,kind,total,correct,at", q => q.in("user_id", ids)) : Promise.resolve([]),
      studentsProgress: (ids) => ids.length ? all("song_progress", "user_id,song_id,last_studied_at", q => q.in("user_id", ids)) : Promise.resolve([]),
      classFeedback: (classId) => run(c => c.from("feedback").select("student_id,text,updated_at").eq("class_id", classId)),
      myFeedback: () => run(c => c.from("feedback").select("class_id,text,updated_at").eq("student_id", session.user.id)),
      saveFeedback: (classId, studentId, text) => run(c => c.from("feedback").upsert({ class_id: classId, student_id: studentId, text })),
      // ---- 6단계: 출석·제출·피드백·주간 인기·안내 확인(서버 함수가 권한과 날짜를 정한다)
      logStudy: (songId, kind) => run(c => c.rpc("log_study", { p_song: songId == null ? null : songId, p_kind: kind })),

      listSubmissions: (classId) => run(c => c.rpc("list_submissions", { p_class: classId || null })),
      giveFeedback: (recId, pron, tone, note) => run(c => c.rpc("give_feedback", { p_recording: recId, p_pron: pron, p_tone: tone, p_note: note })),
      markFeedbackSeen: () => run(c => c.rpc("mark_feedback_seen")),
      submitRecordings: (ids, classId, asgId) => run(c => c.rpc("submit_recordings", { p_recordings: ids, p_class: classId, p_assignment: asgId || null })),
      myOverall: () => run(c => c.from("overall_feedback").select("class_id,song_id,assignment_id,pron,tone,note,feedback_at,seen_at").eq("user_id", session.user.id)),
      classOverall: (classId) => run(c => { let q = c.from("overall_feedback").select("user_id,class_id,song_id,assignment_id,pron,tone,note,feedback_at"); return classId ? q.eq("class_id", classId) : q; }),
      giveOverall: (uid, classId, songId, asgId, p, tn, n) => run(c => c.rpc("give_overall_feedback", { p_user: uid, p_class: classId, p_song: songId, p_assignment: asgId || null, p_pron: p, p_tone: tn, p_note: n })),
      async pathUrl(path) { const d = await run(c => c.storage.from("recordings").createSignedUrl(path, 600)); return d.signedUrl; },
      weeklyPopular: (weeksAgo) => run(c => c.rpc("weekly_popular", { p_weeks_ago: weeksAgo })),
      async ackNotice(kind) { await run(c => c.rpc("ack_notice", { p_kind: kind })); await loadProfile(); },
      // ---- 8단계: 출석 도장·열린 게시판
      checkIn: () => run(c => c.rpc("check_in")),
      checkinDetail: (uid, month) => run(c => c.rpc("checkin_detail", { p_user: uid, p_month: month })),
      boardPosts: (classId) => run(c => c.rpc("board_posts", { p_class: classId })),
      boardPost: (id) => run(c => c.rpc("board_post", { p_post: id })),
      createPost: (row) => run(c => c.from("posts").insert(row).select("id")),
      updatePost: (id, row) => run(c => c.from("posts").update(row).eq("id", id).select("id")),
      deletePost: (id) => run(c => c.from("posts").delete().eq("id", id).select("id")),
      addComment: (postId, body) => run(c => c.from("comments").insert({ post_id: postId, body }).select("id")),
      deleteComment: (id) => run(c => c.from("comments").delete().eq("id", id).select("id")),
      // ---- 7단계: 과제·한 줄 반복 기록
      logRepeat: (songId) => run(c => c.rpc("log_repeat", { p_song: songId })),
      myAssignments: () => run(c => c.rpc("my_assignments")),
      classAssignments: (classId) => run(c => c.rpc("class_assignments", { p_class: classId })),
      assignmentReport: (id) => run(c => c.rpc("assignment_report", { p_asg: id })),
      createAssignment: (row) => run(c => c.from("assignments").insert(row).select("id")),
      deleteAssignment: (id) => run(c => c.from("assignments").delete().eq("id", id).select("id")),
      weeks: () => all("course_weeks", "week_no,song_id,memo,updated_at", q => q.order("week_no")),
      saveWeeks: (rows) => run(c => c.from("course_weeks").upsert(rows).select("week_no")),
      setVideoUrl: (id, url) => run(c => c.from("songs").update({ video_url: url }).eq("id", id).select("id")),
      // ---- 학습 현황(서버 함수가 역할을 확인: 관리자=전체, 교사=자기 반 학생, 학습자=본인)
      studyPeople: () => run(c => c.rpc("study_people")),
      studyDetail: (uid) => run(c => c.rpc("study_detail", { p_user: uid })),
      touchDay: () => run(c => c.from("study_days").upsert({ user_id: session.user.id }, { onConflict: "user_id,day", ignoreDuplicates: true })),
      noProfile: () => !!session && !profile,
      missingProfiles: () => run(c => c.rpc("admin_missing_profiles")),
      createProfile: (uid) => run(c => c.rpc("admin_create_profile", { p_user: uid })),
      // ---- 관리자(서버가 관리자 여부를 다시 확인한다)
      profiles: () => all("profiles", "id,email,display_name,role,teacher_status,created_at,learner_status,last_seen_at", q => q.order("created_at")),
      classMember: (uid, classId, add) => run(c => c.rpc("admin_class_member", { p_user: uid, p_class: classId, p_add: add })),
      setLearner: (uid, approve, classId) => run(c => c.rpc("admin_set_learner", { p_user: uid, p_approve: approve, p_class: classId || null })),

      setTeacher: (uid, approve) => run(c => c.rpc("admin_set_teacher", { p_user: uid, p_approve: approve })),

      exportAll: () => run(c => c.rpc("admin_export")),
      markBackup: () => run(c => c.rpc("admin_mark_backup")),
      lastBackup: async () => { const r = await run(c => c.from("app_meta").select("value").eq("key", "last_backup_at")); return r[0] ? r[0].value : null; },
      snapshots: () => run(c => c.from("server_snapshots").select("id,kind,created_at,summary").order("created_at", { ascending: false })),
      snapshot: async (id) => (await run(c => c.from("server_snapshots").select("payload").eq("id", id)))[0].payload,
      restore: (payload) => run(c => c.rpc("admin_restore", { p: payload })),
      upload: (payload, review) => run(c => c.rpc("admin_upload", { p: payload, p_review: review || null }))
    };
  })();

  /* =========================================================
   * 2. 데이터 저장소(Repository): 서버에서 읽어 와 화면이 바로 쓸 수 있게 들고 있는다.
   *    바꾸는 일은 모두 서버에 먼저 저장하고, 성공하면 그 곡을 서버에서 다시 읽는다.
   * ========================================================= */
  const Repo = (function () {
    let songs = [], songById = new Map(), lyricsBySong = new Map(), originalById = new Map(), originalsBySong = new Map();
    let glossary = {}, myClassIds = new Set(), taughtClassIds = new Set(), classes = [];
    const listeners = [];
    const editLogCache = new Map();
    function notify() { listeners.forEach(fn => { try { fn(); } catch (e) { console.error(e); } }); }
    function songFromRow(r) {
      return { id: r.id, title: r.title, artist: r.artist, chartRank: r.chart_rank, releaseDate: r.release_date, videoUrl: r.video_url,
               videoNote: r.video_note, spotifyUrl: r.spotify_url, durationSec: r.duration_sec == null ? null : Number(r.duration_sec),
               syncOffset: r.sync_offset == null ? null : Number(r.sync_offset), visibility: r.visibility, ownerId: r.owner_id, classId: r.class_id,
               lineCount: r.line_count, status: r.line_count > 0 ? "ready" : "준비 중" };
    }
    function setOriginals(songId, rows) {
      (originalsBySong.get(songId) || []).forEach(o => originalById.delete(o.lineId));
      const list = rows.map(o => ({ songId: o.song_id, lineId: o.line_id, lineNumber: o.line_number, verse: o.verse, vietnamese: o.vietnamese,
                                    korean: o.korean || "", translationStatus: o.translation_status }));
      originalsBySong.set(songId, list);
      list.forEach(o => originalById.set(o.lineId, o));
    }
    function setLyrics(songId, rows) {
      lyricsBySong.set(songId, rows.slice().sort((a, b) => a.position - b.position).map((r, i) => {
        const orig = originalById.get(r.line_id) || null;
        return { songId: songId, lineId: r.line_id, verse: r.verse, lineNumber: i + 1, vietnamese: r.vietnamese, korean: r.korean || "",
                 translationStatus: r.translation_status, startTime: r.start_time == null ? null : Number(r.start_time), calcExcluded: !!r.calc_excluded,
                 modified: !!orig && (orig.vietnamese !== r.vietnamese || orig.korean !== (r.korean || "")), isNew: !orig };
      }));
    }
    function indexSongs(rows) {
      songs = rows.map(songFromRow).sort((a, b) => a.id - b.id);
      songById = new Map(songs.map(s => [s.id, s]));
    }
    async function reloadSong(songId) {
      const [ly, og, srow] = await Promise.all([Server.songLyrics(songId), Server.songOriginals(songId),
        Server.song(songId)]);
      setOriginals(songId, og); setLyrics(songId, ly);
      if (srow[0]) { const s = songFromRow(srow[0]); const i = songs.findIndex(x => x.id === songId); if (i >= 0) songs[i] = s; else songs.push(s); songById.set(songId, s); }
      editLogCache.delete(songId);
      notify();
    }
    function workingList(songId) {
      return (lyricsBySong.get(songId) || []).map(l => ({ lineId: l.lineId, verse: l.verse, vietnamese: l.vietnamese, korean: l.korean, translationStatus: l.translationStatus }));
    }
    function renumberVerses(list) {
      let prev = null, v = 0;
      list.forEach(l => { if (l.verse !== prev) { v++; prev = l.verse; } l._v = v; });
      list.forEach(l => { l.verse = l._v; delete l._v; });
    }
    function findIdx(list, lineId) { const i = list.findIndex(l => l.lineId === lineId); if (i < 0) throw new Error("줄을 찾을 수 없습니다."); return i; }
    async function saveList(songId, list, log) { await Server.saveLyrics(songId, list, log); await reloadSong(songId); }

    return {
      onChange(fn) { listeners.push(fn); },
      // 로그인 전: 공개 곡 목록만(가사 없음)
      async initPublic() {
        indexSongs(await Server.publicSongs());
        lyricsBySong = new Map(); originalById = new Map(); originalsBySong = new Map(); glossary = {};
        myClassIds = new Set(); taughtClassIds = new Set(); classes = [];
        notify();
      },
      // 로그인 뒤: 볼 수 있는 곡·가사·단어장·반
      async initUser() {
        const [srows, lrows, orows, grows, crows, mrows] = await Promise.all([Server.songs(), Server.lyrics(), Server.originals(), Server.glossary(),
          Server.myClasses(), Server.myMemberships()]);
        indexSongs(srows);
        originalById = new Map(); originalsBySong = new Map(); lyricsBySong = new Map();
        const ob = new Map(); orows.forEach(o => { if (!ob.has(o.song_id)) ob.set(o.song_id, []); ob.get(o.song_id).push(o); });
        ob.forEach((rows, sid) => setOriginals(sid, rows));
        const lb = new Map(); lrows.forEach(l => { if (!lb.has(l.song_id)) lb.set(l.song_id, []); lb.get(l.song_id).push(l); });
        lb.forEach((rows, sid) => setLyrics(sid, rows));
        glossary = {}; grows.forEach(g => { glossary[g.word] = g.meaning; });
        classes = crows;
        myClassIds = new Set(mrows.map(m => m.class_id));
        const me = Server.user() ? Server.user().id : null;
        taughtClassIds = new Set(crows.filter(c => c.teacher_id === me).map(c => c.id));
        editLogCache.clear();
        notify();
      },
      async reloadClasses() {
        const [crows, mrows] = await Promise.all([Server.myClasses(), Server.myMemberships()]);
        classes = crows; myClassIds = new Set(mrows.map(m => m.class_id));
        const me = Server.user() ? Server.user().id : null;
        taughtClassIds = new Set(crows.filter(c => c.teacher_id === me).map(c => c.id));
      },
      reloadSong,
      getSongs: () => songs,
      getSong: (id) => songById.get(id) || null,
      getLyrics: (id) => lyricsBySong.get(id) || [],
      getOriginal: (lineId) => originalById.get(lineId) || null,
      getClasses: () => classes,
      memberOf: (cid) => myClassIds.has(cid),
      teaches: (cid) => taughtClassIds.has(cid) && Server.canTeach(),
      // 화면에서 편집 도구를 보여줄지(실제 허용 여부는 서버 규칙이 정한다)
      canEdit(songId) {
        const s = songById.get(songId), me = Server.user();
        if (!s || !me) return false;
        if (Server.isAdmin()) return true;
        if (s.visibility === "class") return taughtClassIds.has(s.classId) && Server.isTeacher();
        if (s.visibility === "private") return s.ownerId === me.id;
        return false;
      },
      nextSongId: () => songs.reduce((m, s) => Math.max(m, s.id), 0) + 1,
      counts() {
        let lyr = 0; lyricsBySong.forEach(l => { lyr += l.length; });
        return { songs: songs.length, ready: songs.filter(s => s.status === "ready").length, lyrics: lyr };
      },
      syncStatus() {
        return songs.filter(s => s.status === "ready").map(s => {
          const ls = this.getLyrics(s.id);
          return { id: s.id, title: s.title, synced: ls.filter(l => typeof l.startTime === "number").length, total: ls.length };
        }).filter(x => x.synced > 0);
      },
      async getEditLog(songId) {
        if (!editLogCache.has(songId)) {
          const rows = await Server.editLog(songId);
          editLogCache.set(songId, rows.map(r => ({ lineId: r.line_id, action: r.action, before: r.before, after: r.after, at: r.at })));
        }
        return editLogCache.get(songId);
      },
      // 곡 추가: 역할에 따라 공개 범위가 정해진다(학습자=개인, 교사=반, 관리자=공개). 서버 규칙이 다시 확인한다.
      async addSong(fields, lyricRows, target) {
        const me = Server.user();
        const row = { title: fields.title, artist: fields.artist, chart_rank: fields.chartRank, release_date: fields.releaseDate, video_url: fields.videoUrl,
                      visibility: target.visibility, owner_id: me.id, class_id: target.classId || null };
        const created = (await Server.insertSong(row))[0];
        const lines = lyricRows.map(r => ({ lineId: newLineId() + r.lineNumber, verse: r.verse, vietnamese: r.vietnamese, korean: r.korean, translationStatus: r.translationStatus, lineNumber: r.lineNumber }));
        try {
          if (lines.length) {
            await Server.saveLyrics(created.id, lines.map(l => ({ lineId: l.lineId, verse: l.verse, vietnamese: l.vietnamese, korean: l.korean, translationStatus: l.translationStatus })), []);
            await Server.insertOriginals(lines.map(l => ({ line_id: l.lineId, song_id: created.id, line_number: l.lineNumber, verse: l.verse,
                                                           vietnamese: l.vietnamese, korean: l.korean || "", translation_status: l.translationStatus })));
          }
        } catch (e) { try { await Server.deleteSong(created.id); } catch (x) {} throw e; }
        await reloadSong(created.id);
        return songById.get(created.id);
      },
      async updateSong(id, patch) {
        const map = { durationSec: "duration_sec", syncOffset: "sync_offset" }, row = {};
        Object.keys(patch).forEach(k => { if (!map[k]) throw new Error("'" + k + "' 칸은 바꿀 수 없습니다."); row[map[k]] = patch[k]; });
        const r = await Server.updateSong(id, row);
        if (r && r.length) { const s = songById.get(id); Object.assign(s, patch); notify(); }
        return !!(r && r.length);
      },
      // 싱크: times의 키는 줄 번호 또는 줄 ID, 값은 초 또는 null
      async setSync(songId, times, offset) {
        const lyr = this.getLyrics(songId), conv = {};
        Object.keys(times).forEach(k => {
          if (!isTime(times[k])) throw new Error(k + "번 줄의 시간이 올바르지 않습니다.");
          const l = lyr.find(x => String(x.lineNumber) === String(k)) || lyr.find(x => x.lineId === k);
          if (!l) throw new Error(songId + "번 곡에 '" + k + "' 줄이 없습니다.");
          conv[l.lineId] = times[k] === null ? null : Math.round(times[k] * 100) / 100;
        });
        await Server.saveSync(songId, conv, offset === undefined ? undefined : Math.round(offset * 100) / 100);
        await reloadSong(songId);
      },
      async setExcluded(songId, lineId, value) {
        const r = await Server.setExcluded(lineId, value);
        if (!r || !r.length) throw new Error("권한이 없습니다.");
        await reloadSong(songId);
      },
      async editLine(songId, lineId, fields) {
        const list = workingList(songId), l = list[findIdx(list, lineId)], log = [];
        if (fields.vietnamese !== undefined && fields.vietnamese !== l.vietnamese) {
          if (!fields.vietnamese.trim()) throw new Error("베트남어 원문은 비울 수 없습니다.");
          log.push({ lineId, action: "원문 수정", before: l.vietnamese, after: fields.vietnamese });
          l.vietnamese = fields.vietnamese;
        }
        if (fields.korean !== undefined && fields.korean !== l.korean) {
          const before = { korean: l.korean, translationStatus: l.translationStatus };
          l.korean = fields.korean; l.translationStatus = fields.korean.trim() ? "검수 완료" : null;
          log.push({ lineId, action: "번역 수정", before, after: { korean: l.korean, translationStatus: l.translationStatus } });
        }
        if (!log.length) return;
        await saveList(songId, list, log);
      },
      async reviewLine(songId, lineId) { // AI 번역 검수: 글자는 그대로, 상태만 '검수 완료'
        const list = workingList(songId), l = list[findIdx(list, lineId)];
        if (!(l.korean || "").trim()) throw new Error("번역이 없는 줄은 검수할 수 없습니다.");
        const before = { korean: l.korean, translationStatus: l.translationStatus };
        l.translationStatus = "검수 완료";
        await saveList(songId, list, [{ lineId, action: "번역 검수", before, after: { korean: l.korean, translationStatus: "검수 완료" } }]);
      },
      async insertLineAfter(songId, afterLineId, fields) {
        if (!fields.vietnamese || !fields.vietnamese.trim()) throw new Error("새 줄의 베트남어 원문을 입력하세요.");
        const list = workingList(songId), i = findIdx(list, afterLineId), lineId = newLineId(), ko = fields.korean || "";
        list.splice(i + 1, 0, { lineId, verse: list[i].verse, vietnamese: fields.vietnamese, korean: ko, translationStatus: ko.trim() ? "검수 완료" : null });
        await saveList(songId, list, [{ lineId, action: "줄 넣기", before: null, after: { after: afterLineId, vietnamese: fields.vietnamese, korean: ko } }]);
        return lineId;
      },
      async deleteLine(songId, lineId) {
        const list = workingList(songId), i = findIdx(list, lineId);
        if (list.length <= 1) throw new Error("마지막 한 줄은 지울 수 없습니다.");
        const cur = this.getLyrics(songId).find(x => x.lineId === lineId);
        const gone = list.splice(i, 1)[0]; renumberVerses(list);
        await saveList(songId, list, [{ lineId, action: "줄 지우기", before: { vietnamese: gone.vietnamese, korean: gone.korean, startTime: cur ? cur.startTime : null }, after: null }]);
      },
      async splitVerse(songId, lineId) {
        const list = workingList(songId), i = findIdx(list, lineId);
        if (i === 0 || list[i - 1].verse !== list[i].verse) throw new Error("절의 첫 줄에서는 나눌 수 없습니다.");
        for (let k = i; k < list.length; k++) list[k].verse += 1;
        renumberVerses(list);
        await saveList(songId, list, [{ lineId, action: "절 나누기", before: null, after: null }]);
      },
      async mergeVerse(songId, lineId) {
        const list = workingList(songId), i = findIdx(list, lineId);
        if (i === 0 || list[i - 1].verse === list[i].verse) throw new Error("절의 첫 줄에서만 앞 절과 합칠 수 있습니다.");
        const v = list[i].verse;
        for (let k = i; k < list.length; k++) list[k].verse -= 1;
        renumberVerses(list);
        await saveList(songId, list, [{ lineId, action: "앞 절과 합치기", before: null, after: { verse: v } }]);
      },
      async revertLine(songId, lineId) {
        const o = originalById.get(lineId);
        if (!o) throw new Error("새로 넣은 줄은 원래 상태가 없습니다.");
        const list = workingList(songId), l = list[findIdx(list, lineId)];
        const before = { vietnamese: l.vietnamese, korean: l.korean, translationStatus: l.translationStatus };
        l.vietnamese = o.vietnamese; l.korean = o.korean; l.translationStatus = o.translationStatus;
        await saveList(songId, list, [{ lineId, action: "원래대로", before, after: { vietnamese: o.vietnamese, korean: o.korean, translationStatus: o.translationStatus } }]);
      },
      originalLineId(songId, n) { const o = (originalsBySong.get(songId) || []).find(x => x.lineNumber === n); return o ? o.lineId : null; },
      // ---- 단어장(승인된 교사·관리자만 쓰기)
      getGlossary: () => glossary,
      async setGlossary(entries) {
        const up = [], del = [];
        Object.keys(entries).forEach(k => {
          const w = VocabEngine.normWord(k), m = String(entries[k] || "").trim();
          if (!w) return; if (m) up.push({ word: w, meaning: m }); else del.push(w);
        });
        if (up.length) await Server.upsertGlossary(up);
        if (del.length) await Server.deleteGlossary(del);
        up.forEach(r => { glossary[r.word] = r.meaning; }); del.forEach(w => { delete glossary[w]; });
        notify();
      }
    };
  })();

  /* 임베드 시험 기록(시험용, 7단계에서 정리). 학습 데이터와 따로 저장한다. */
  const Diag = (function () {
    let data = {};
    return {
      async init() { data = Local.read("nbv.embedDiag.v1") || {}; },
      get: (id) => data[String(id)] || null,
      async record(id, patch) {
        data[String(id)] = Object.assign({}, data[String(id)] || {}, patch, { checkedAt: new Date().toISOString() });
        Local.write("nbv.embedDiag.v1", data); // 시험 기록은 이 브라우저에만
      }
    };
  })();

  /* =========================================================
   * 2-1. 어휘 설정 (교사가 편집: 별 구간, 가중치, 다음절 어휘, 제외 단어, 제외 줄)
   * ========================================================= */
  const VOCAB = JSON.parse(document.getElementById("vocab-data").textContent).words;
  const SETTINGS_DEFAULTS = JSON.parse(document.getElementById("settings-defaults").textContent);
  const KEYWORD_MAX = 10; // 곡당 핵심 단어 최대 개수
  const SETTINGS_VERSION = 2; // 2 = 제외 줄을 줄 ID로 저장
  // 설정 버전 1(제외 줄 = 줄 번호) → 2(줄 ID). 그 시점에는 가사 편집이 없었으므로 줄 번호 = 원래 줄 번호.
  function migrateSettingsV1(s) {
    const n = JSON.parse(JSON.stringify(s));
    const ex = {};
    Object.keys(n.excludedLines || {}).forEach(k => {
      ex[k] = (n.excludedLines[k] || []).map(x => typeof x === "number" ? (Repo.originalLineId(Number(k), x) || null) : x).filter(Boolean);
    });
    n.excludedLines = ex;
    if (typeof n.keyWordIncludeStar1 !== "boolean") n.keyWordIncludeStar1 = false;
    n.settingsVersion = SETTINGS_VERSION;
    return n;
  }
  // 4단계 보완에서 생긴 칸: 예전 설정·백업에 없으면 처음 값으로 채운다.
  const LATER_SETTING_KEYS = ["keyWordIncludeStar1", "keyWordStar2Max", "keyWordStar3Min", "keyWordExclude"];
  function upgradeSettings(s) {
    if (!s) return s;
    let n = s.settingsVersion !== SETTINGS_VERSION ? migrateSettingsV1(s) : s;
    const missing = LATER_SETTING_KEYS.filter(k => !(k in n));
    if (missing.length) { n = JSON.parse(JSON.stringify(n)); missing.forEach(k => { n[k] = JSON.parse(JSON.stringify(SETTINGS_DEFAULTS[k])); }); }
    return n;
  }
  const isSyllable = w => /^[\p{L}\p{M}]+$/u.test(w);

  function validateSettings(s) {
    const errors = [];
    if (!s || typeof s !== "object") return ["설정 형식이 아닙니다."];
    const b = s.bounds, w = s.weights;
    if (!Array.isArray(b) || b.length !== 3 || !b.every(x => Number.isInteger(x) && x >= 1) || !(b[0] < b[1] && b[1] < b[2]))
      errors.push("별 구간 경계는 1 이상의 정수 3개이고, 앞의 값이 뒤의 값보다 작아야 합니다.");
    if (!Array.isArray(w) || w.length !== 2 || !w.every(x => typeof x === "number" && isFinite(x) && x >= 0))
      errors.push("가중치는 0 이상의 숫자 2개여야 합니다.");
    if (!Array.isArray(s.multiWords)) errors.push("다음절 어휘 목록 형식이 틀렸습니다.");
    else s.multiWords.forEach(p => {
      const parts = VocabEngine.normWord(p).split(" ");
      if (parts.length < 2 || !parts.every(isSyllable)) errors.push("다음절 어휘 '" + p + "'은(는) 띄어 쓴 음절 2개 이상이어야 합니다.");
    });
    if (!Array.isArray(s.excludeWords)) errors.push("제외 단어 목록 형식이 틀렸습니다.");
    else s.excludeWords.forEach(x => {
      const n = VocabEngine.normWord(x);
      if (!isSyllable(n)) errors.push("제외 단어 '" + x + "'은(는) 음절 하나여야 합니다.");
      else if (VOCAB[n]) errors.push("제외 단어 '" + x + "'은(는) 고빈도 기준표에 있는 음절이라 넣을 수 없습니다.");
    });
    if (!s.excludedLines || typeof s.excludedLines !== "object" || Array.isArray(s.excludedLines)) errors.push("제외 줄 형식이 틀렸습니다.");
    else Object.keys(s.excludedLines).forEach(k => {
      const v = s.excludedLines[k];
      if (!/^\d+$/.test(k) || !Array.isArray(v) || !v.every(n => typeof n === "string" && n)) errors.push("곡 " + k + "의 제외 줄 형식이 틀렸습니다.");
    });
    if (typeof s.keyWordIncludeStar1 !== "boolean") errors.push("핵심 단어 ★ 포함 설정이 틀렸습니다.");
    if (s.semesterStart !== undefined && !/^\d{4}-\d{2}-\d{2}$/.test(String(s.semesterStart))) errors.push("학기 시작일은 YYYY-MM-DD 형식이어야 합니다.");
    if (s.recordingLimit !== undefined && !(Number.isInteger(s.recordingLimit) && s.recordingLimit >= 1 && s.recordingLimit <= 200)) errors.push("녹음 보관 개수는 1~200 사이의 정수여야 합니다.");
    [["keyWordStar2Max", "★★ 최대 개수"], ["keyWordStar3Min", "★★★ 최소 개수"]].forEach(([k, label]) => {
      if (!Number.isInteger(s[k]) || s[k] < 0 || s[k] > KEYWORD_MAX) errors.push(label + "는 0~" + KEYWORD_MAX + " 사이의 정수여야 합니다.");
    });
    if (!Array.isArray(s.keyWordExclude) || !s.keyWordExclude.every(w => typeof w === "string" && VocabEngine.normWord(w).split(" ").every(isSyllable)))
      errors.push("핵심 단어 제외 목록 형식이 틀렸습니다.");
    return errors;
  }

  // 전체 어휘 설정은 서버(app_settings) 한 곳에 있고 관리자만 바꾼다. 제외 줄은 각 가사 줄에 붙어 있다(lyrics.calc_excluded).
  const Settings = (function () {
    let cur = null, exCache = null;
    const listeners = [];
    const clone = o => JSON.parse(JSON.stringify(o));
    function fromDefaults() { const d = clone(SETTINGS_DEFAULTS); delete d.excludedLines; d.settingsVersion = SETTINGS_VERSION; return d; }
    function excludedLines() {
      if (!exCache) {
        exCache = {};
        Repo.getSongs().forEach(s => { const ids = Repo.getLyrics(s.id).filter(l => l.calcExcluded).map(l => l.lineId); if (ids.length) exCache[String(s.id)] = ids; });
      }
      return exCache;
    }
    Repo.onChange(() => { exCache = null; listeners.forEach(fn => fn()); });
    return {
      onChange(fn) { listeners.push(fn); },
      async load() {
        const rows = await Server.settings();
        const d = rows[0] ? rows[0].data : null;
        cur = Object.assign(fromDefaults(), d || {}, { settingsVersion: SETTINGS_VERSION });
        if (typeof cur.recordingLimit !== "number") cur.recordingLimit = 20;
        exCache = null; listeners.forEach(fn => fn());
      },
      useDefaults() { cur = fromDefaults(); cur.recordingLimit = 20; exCache = null; },
      get() { return Object.assign({}, cur, { excludedLines: excludedLines() }); },
      defaults: () => Object.assign(fromDefaults(), { recordingLimit: 20 }),
      validate: (s) => validateSettings(Object.assign({}, s, { excludedLines: {} })),
      async replace(next) {
        const n = clone(next); delete n.excludedLines;
        const errs = validateSettings(Object.assign({}, n, { excludedLines: {} }));
        if (errs.length) throw new Error(errs[0]);
        n.multiWords = Array.from(new Set(n.multiWords.map(VocabEngine.normWord)));
        n.excludeWords = Array.from(new Set(n.excludeWords.map(VocabEngine.normWord)));
        n.keyWordExclude = Array.from(new Set(n.keyWordExclude.map(VocabEngine.normWord)));
        n.settingsVersion = SETTINGS_VERSION;
        if (typeof n.recordingLimit !== "number") n.recordingLimit = cur.recordingLimit || 20;
        const r = await Server.saveSettings(n);
        if (!r || !r.length) throw new Error("권한이 없습니다(전체 설정은 관리자만 바꿀 수 있습니다).");
        cur = n; exCache = null;
        listeners.forEach(fn => fn());
      },
      async update(patch) { const base = clone(cur); Object.assign(base, patch); await this.replace(base); }
    };
  })();

  /* =========================================================
   * 2-2. 곡 어휘 분석·단계 (설정이나 곡 데이터가 바뀌면 다시 계산)
   * ========================================================= */
  const Analysis = (function () {
    let cache = null;
    function compute() {
      const s = Settings.get();
      const cfg = { bounds: s.bounds, weights: s.weights, multiWords: s.multiWords, excludeWords: s.excludeWords };
      const bySong = new Map();
      Repo.getSongs().filter(x => x.status === "ready").forEach(song => {
        const lyrics = Repo.getLyrics(song.id);
        if (!lyrics.length) return;
        const a = VocabEngine.analyzeSong(lyrics, VOCAB, cfg, s.excludedLines[String(song.id)] || []);
        a.id = song.id;
        bySong.set(song.id, a);
      });
      // 단계: 공개 곡끼리 순위 사분위를 정하고, 반·개인 곡은 공개 곡 사이 어디에 들어가는지로 분류한다(사람마다 볼 수 있는 곡이 달라도 단계가 같도록).
      const pub = Array.from(bySong.values()).filter(a => (Repo.getSong(a.id) || {}).visibility === "public");
      const levels = VocabEngine.assignLevels(pub.map(a => ({ id: a.id, score: a.score })));
      const n = pub.length;
      const pubScores = pub.map(a => VocabEngine.roundScore(a.score));
      bySong.forEach((a, id) => {
        if (levels.has(id)) { Object.assign(a, levels.get(id)); a.basis = "public"; return; }
        const rs = VocabEngine.roundScore(a.score);
        const rank = 1 + pubScores.filter(x => x < rs).length;
        a.rank = rank; a.n = n; a.basis = "placed";
        a.level = n ? Math.min(3, Math.floor(4 * (rank - 1) / n)) : 0;
      });
      return { bySong: bySong, n: n };
    }
    function invalidate() { cache = null; }
    Repo.onChange(invalidate);
    Settings.onChange(invalidate);
    return {
      all() { if (!cache) cache = compute(); return cache; },
      get(id) { return this.all().bySong.get(id) || null; },
      invalidate: invalidate
    };
  })();
  /* =========================================================
   * 2-3. 핵심 단어 (곡당 최대 10개) — 뜻은 단어장에서만 가져온다
   * ========================================================= */
  const KeyWords = (function () {
    let cache = new Map();
    Repo.onChange(() => cache.clear());
    Settings.onChange(() => cache.clear());
    function build(songId) {
      const a = Analysis.get(songId);
      if (!a) return [];
      const lyr = Repo.getLyrics(songId), g = Repo.getGlossary();
      const st = Settings.get(), ex = {};
      st.keyWordExclude.forEach(w => { ex[w] = true; });
      return VocabEngine.keyWords(a, g, { max: KEYWORD_MAX, includeStar1: st.keyWordIncludeStar1,
        star2Max: st.keyWordStar2Max, star3Min: st.keyWordStar3Min, exclude: ex }).map(w => {
        // 예문: 번역이 있는 첫 줄, 없으면 처음 나온 줄
        const li = w.lines.find(i => (lyr[i].korean || "").trim()) ?? w.lines[0];
        const meaning = g[w.key] || null;
        return { key: w.key, star: w.star, count: w.count, tones: VocabEngine.toneText(w.key), meaning: meaning,
                 similar: VocabEngine.similarWords(w.key, VOCAB, g), exampleIndex: li, example: lyr[li], songId: songId };
      });
    }
    return {
      forSong(songId) { if (!cache.has(songId)) cache.set(songId, build(songId)); return cache.get(songId); },
      eligible(songId) { return this.forSong(songId).filter(w => w.meaning); }
    };
  })();

  // 분석된 한 줄에서 핵심 단어를 ___로 가린 글자를 만든다(다음절 어휘는 ___ 하나).
  function blankedLine(la, keySet, onlyKey) {
    let out = "", i = 0;
    const parts = la.parts;
    while (i < parts.length) {
      const pt = parts[i];
      const tk = pt.token;
      if (tk && !tk.excluded) {
        const key = tk.phrase || tk.lower;
        const hit = onlyKey ? key === onlyKey : keySet.has(key);
        if (hit) {
          out += "___";
          if (tk.phrase) { // 다음절 어휘의 나머지 음절과 사이 공백을 건너뛴다
            let n = tk.phrase.split(" ").length - 1, j = i + 1;
            while (n > 0 && j < parts.length) { if (parts[j].token) n--; j++; }
            i = j; if (onlyKey) onlyKey = "\u0000"; continue;
          }
          if (onlyKey) onlyKey = "\u0000"; // 연습 문제에서는 첫 번째만 가린다
          i++; continue;
        }
      }
      out += pt.text; i++;
    }
    return out;
  }

  /* =========================================================
   * 2-4. 학습 기록(틀린 단어·헷갈려요 → 1·3·7일 뒤 복습). 5단계에서 사용자별로 나눈다.
   * ========================================================= */
  const REVIEW_DAYS = [1, 3, 7];
  function todayStr() {
    if (window.__nbvTodayOverride) return window.__nbvTodayOverride; // 시험용
    // 서버(출석 · 복습 날짜)와 같은 한국 시간 기준. 베트남 등 다른 시간대에서 열어도 날짜가 어긋나지 않게.
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }
    catch (e) { const d = new Date(Date.now() + 9 * 3600000), p = n => String(n).padStart(2, "0"); return d.getUTCFullYear() + "-" + p(d.getUTCMonth() + 1) + "-" + p(d.getUTCDate()); }
  }
  function addDays(ds, n) {
    const [y, m, d] = ds.split("-").map(Number), dt = new Date(y, m - 1, d + n), p = x => String(x).padStart(2, "0");
    return dt.getFullYear() + "-" + p(dt.getMonth() + 1) + "-" + p(dt.getDate());
  }
  // 학습 기록은 사용자별로 서버에 저장한다(review_items). 본인과 그 반 교사·관리자만 읽을 수 있다.
  const Learner = (function () {
    let data = { version: 1, items: {} };
    const toRow = it => ({ word: it.key, song_id: it.songId == null ? null : it.songId, wrong: it.wrong, confused: it.confused, first_at: it.firstAt,
                           last_at: it.lastAt, schedule: it.schedule, done: it.done, example: it.example || null });
    return {
      async load() {
        const rows = await Server.myReview(); data = { version: 1, items: {} };
        rows.forEach(r => { data.items[r.word] = { key: r.word, songId: r.song_id, wrong: r.wrong, confused: r.confused, firstAt: r.first_at, lastAt: r.last_at,
                                                    schedule: r.schedule || [], done: r.done, example: r.example }; });
      },
      clear() { data = { version: 1, items: {} }; },
      get: () => data,
      async mark(kind, w) {
        const T = todayStr(), prev = data.items[w.key];
        const it = prev ? Object.assign({}, prev) : { key: w.key, wrong: 0, confused: 0, firstAt: T };
        if (kind === "wrong") it.wrong++; else it.confused++;
        it.songId = w.songId; it.lastAt = T;
        it.example = w.example ? { vietnamese: w.example.vietnamese, korean: w.example.korean } : (it.example || null);
        it.schedule = REVIEW_DAYS.map(n => addDays(T, n)); it.done = 0;
        await Server.upsertReview(toRow(it));
        data.items[w.key] = it;
      },
      due() { const T = todayStr(); return Object.values(data.items).filter(it => it.done < it.schedule.length && it.schedule[it.done] <= T); },
      async reviewed(key, ok) {
        const prev = data.items[key]; if (!prev) return;
        const it = Object.assign({}, prev);
        if (ok) it.done++; else { it.confused++; it.schedule = REVIEW_DAYS.map(n => addDays(todayStr(), n)); it.done = 0; }
        await Server.upsertReview(toRow(it));
        data.items[key] = it;
      },
      all() { return Object.values(data.items).sort((a, b) => (b.lastAt || "").localeCompare(a.lastAt || "") || a.key.localeCompare(b.key)); }
    };
  })();

  // 진도 = 곡별 마지막 학습일 + 연습 종류별 최고 정답률. 즐겨찾기.
  const PRACTICE_KINDS = [["flash", "플래시카드"], ["meaning", "뜻"], ["blank", "빈칸"], ["tone", "성조"], ["game", "30초 게임"]];
  const Progress = (function () {
    let last = new Map(), results = [], favs = new Set();
    function best(rows) { // {songId: {kind: 최고 정답률(%)}}
      const out = {};
      rows.forEach(r => { if (!r.total) return; const p = Math.round(r.correct / r.total * 100); const s = (out[r.song_id] = out[r.song_id] || {}); s[r.kind] = Math.max(s[r.kind] || 0, p); });
      return out;
    }
    return {
      async load() {
        const [p, r, f] = await Promise.all([Server.myProgress(), Server.myPractice(), Server.myFavorites()]);
        last = new Map(p.map(x => [x.song_id, x.last_studied_at])); results = r; favs = new Set(f.map(x => x.song_id));
      },
      clear() { last = new Map(); results = []; favs = new Set(); },
      lastStudied: (songId) => last.get(songId) || null,
      bestRates: () => best(results),
      summarize: best,
      async touch(songId) {
        try { await Server.touchProgress(songId); last.set(songId, new Date().toISOString()); } catch (e) { /* 표시만 실패 */ }
        Server.touchDay().catch(() => {}); // 이번 주 학습한 날
      },
      // 연습을 열었을 때 '시작함'을 남긴다(끝까지 하면 record가 '완료'를 남긴다)
      start(songId, kind, total) { Server.addPractice({ song_id: songId, kind, total, correct: 0, finished: false }).catch(() => {}); },
      async record(songId, kind, total, correct) {
        if (!total) return;
        await Server.addPractice({ song_id: songId, kind, total, correct });
        results.push({ song_id: songId, kind, total, correct, at: new Date().toISOString() });
      },
      isFav: (songId) => favs.has(songId),
      async toggleFav(songId) {
        if (favs.has(songId)) { await Server.removeFavorite(songId); favs.delete(songId); }
        else { await Server.addFavorite(songId); favs.add(songId); }
        return favs.has(songId);
      },
      favorites: () => favs
    };
  })();

  const YT_ERRORS = {

  };

  function youtubeId(url) {
    if (typeof url !== "string") return null;
    let str = url.trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(str)) return str; // 영상 ID만 붙여넣은 경우
    if (!/^https?:\/\//i.test(str)) str = "https://" + str; // youtu.be/… 처럼 https:// 없이 붙여넣은 경우
    let u;
    try { u = new URL(str); } catch (e) { return null; }
    const host = u.hostname.replace(/^www\.|^m\.|^music\./, "");
    let id = null;
    if (host === "youtu.be") id = u.pathname.split("/")[1];
    else if (host === "youtube.com" || host === "youtube-nocookie.com") {
      if (u.pathname === "/watch") id = u.searchParams.get("v");
      else {
        const m = u.pathname.match(/^\/(embed|shorts|live|v)\/([^/?#]+)/);
        if (m) id = m[2];
      }
    }
    return id && /^[A-Za-z0-9_-]{11}$/.test(id) ? id : null;
  }

    if (window.YT && window.YT.Player) return Promise.resolve(window.YT);

      const timer = setTimeout(() => { ytPromise = null; reject(new Error("유튜브 플레이어 응답 없음")); }, 15000);
      window.onYouTubeIframeAPIReady = () => { clearTimeout(timer); resolve(window.YT); };
      const s = document.createElement("script");
      s.src = "https://www.youtube.com/iframe_api";
      s.onerror = () => { clearTimeout(timer); ytPromise = null; s.remove(); reject(new Error("유튜브 플레이어를 불러오지 못했습니다")); };
      document.head.appendChild(s);

  // 홈 '오늘의 추천곡': 볼 수 있는 학습 가능 곡 중 차트 순위가 가장 높은 곡(숫자가 작은 곡)
  function recommendedSong() {
    const cand = Repo.getSongs().filter(s => s.status === "ready" && Analysis.get(s.id));
    cand.sort((a, b) => (a.chartRank == null ? Infinity : a.chartRank) - (b.chartRank == null ? Infinity : b.chartRank) || a.id - b.id);
    return cand[0] || null;
  }
  function heroNodes(s) {
    const a = Analysis.get(s.id);
    const speed = s.durationSec > 0 ? String(Math.round(a.sung / (s.durationSec / 60))) : null;
    const go = el("a", { class: "btn primary", href: "#/song/" + s.id, text: "학습 시작" });
    return el("section", { class: "hero", "aria-label": "오늘의 추천곡" }, [
      el("div", { class: "h-text" }, [el("p", { class: "kicker", text: "오늘의 추천곡" }), el("p", { class: "big", lang: "vi", text: s.title }),
        el("p", { class: "spaced", lang: "vi", text: s.artist.toUpperCase() })]),
      el("div", { class: "h-badges ibadges" }, [
        infoBadge("level", LEVEL_NAMES[a.level] + " · " + VocabEngine.roundScore(a.score).toFixed(1), "단계 · 어휘 점수"),
        infoBadge("chart", s.chartRank != null ? s.chartRank + "위" : "순위 없음", "Spotify 차트 순위"),
        infoBadge("speed", speed || "확인 필요", speed ? "분당 음절 · 가사 속도" : "영상 길이 확인 필요"),
        infoBadge("words", KeyWords.forSong(s.id).length + "개", "핵심 단어")]),
      el("div", { class: "h-cta cta-row" }, [go]),
      el("div", { class: "h-stage stage", "aria-hidden": "true" }, [el("div", { class: "sun" }),
        el("div", { class: "plinth" }, [el("div", { class: "side" }), el("div", { class: "top" })]), thumbNode(s, "pic")])
    ]);
  }

  function jewelCurtain() {
    const box = el("div", { class: "curtain", "aria-hidden": "true" });

    const N = 66;
    for (let k = 0; k < N; k++) {
      const len = 34 + Math.round(rnd() * 96) + (k % 6 === 3 ? 34 : 0);
      const s = el("span", { class: "strand d" + (k % 3), "data-len": String(len) });
      s.style.left = (k * 100 / N + rnd() * 0.7).toFixed(2) + "%"; s.style.height = len + "px"; s.style.animationDelay = (-rnd() * 6).toFixed(2) + "s";
      if (k % 3 === 1) { const i = el("i", { text: "✦" }); i.style.top = Math.round(rnd() * len * 0.8) + "px"; i.style.animationDelay = (-rnd() * 2).toFixed(2) + "s"; s.appendChild(i); }
      box.appendChild(s);
    }
    return box;
  }

  function fmtClock(sec) {

  function renderSong(id, opts) {
    opts = opts || {};

    const back = el("a", { class: "btn", href: "#/", text: "← 곡 목록" });

    let editLyrics = false; // [가사 편집]

    let rec = { recorder: null, stream: null, chunks: [], active: false };
    const recordings = new Map(); // 줄 번호 → {url, type}
    let timed = [];       // [{ln, t}] 보정값까지 더한 시작 시간, 시간 순

    function refreshTiming() {
      lyrics = Repo.getLyrics(id);

      timed = lyrics.filter(l => typeof l.startTime === "number").map(l => ({ ln: l.lineNumber, t: l.startTime + off })).sort((a, b) => a.t - b.t);

    const modeBtns = [["vi", "베트남어"], ["ko", "한국어"], ["both", "둘 다"], ["blank", "빈칸"], ["off", "끄기"]].map(([k, label]) => {

      if (!force && ln === shownLine) return;

      const kids = [];

      if (syncOn) syncClock.textContent = fmtClock(tm);

    function seek(sec) { guardUntil = Date.now() + 600; player.seekTo(sec, true); }

    /* ---------- 반복 ---------- */
    function startRepeat(fromLine, toLine) {

      if (!a || !b) { playStatus.replaceChildren(el("p", { class: "need", text: "싱크가 없는 줄은 반복할 수 없습니다(자막 싱크 설정 필요)." })); return; }
      if (b.end <= a.start) { playStatus.replaceChildren(el("p", { class: "bad", text: "끝 줄이 시작 줄보다 앞에 있습니다." })); return; }
      playOnce = null;
      repeat = { fromLine: fromLine, toLine: toLine, start: a.start, end: b.end };
      Server.logRepeat(id).catch(() => {}); // 과제: 한 줄 반복 연습 기록

    function stopRepeat() { repeat = null; drawPlayStatus(); drawLyrics(); }
    function drawPlayStatus() {

    }
    function onLineTap(l) {

      startRepeat(l.lineNumber, l.lineNumber);
    }

    function lineOptions(selected) {
      return lyrics.map(l => el("option", { value: String(l.lineNumber), selected: l.lineNumber === selected,
        text: l.lineNumber + ". " + shortText(l.vietnamese, 28) + (typeof l.startTime === "number" ? "" : " (싱크 없음)") }));
    }
    function drawRange() {
      const fromSel = el("select", { id: "r-from", "aria-label": "구간 시작 줄" }, lineOptions(repeat ? repeat.fromLine : (timed[0] ? timed[0].ln : lyrics[0].lineNumber)));
      const toSel = el("select", { id: "r-to", "aria-label": "구간 끝 줄" }, lineOptions(repeat ? repeat.toLine : (timed[0] ? timed[0].ln : lyrics[0].lineNumber)));
      const go = el("button", { type: "button", text: "구간 반복" });
      go.addEventListener("click", () => {
        let a = Number(fromSel.value), b = Number(toSel.value);
        if (indexOfLine(a) > indexOfLine(b)) { const x = a; a = b; b = x; }

      });
      fill(rangePanel,
        el("p", { class: "small muted", text: "가사 한 줄을 누르면 그 줄만 반복합니다(다시 누르면 해제). 여러 줄은 아래에서 고르세요." }),
        el("div", { class: "range-row" }, [el("label", { for: "r-from", text: "시작" }), fromSel]),
        el("div", { class: "range-row" }, [el("label", { for: "r-to", text: "끝" }), toSel]),
        el("div", { class: "row-actions" }, [go])

    }

    /* ---------- 따라 부르기 ---------- */
    function pickMime() {
      if (typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";

      return "";

    const recAudio = el("audio", { preload: "auto" });

    function drawPractice() {

      const sel = el("select", { id: "p-line", "aria-label": "따라 부를 줄" }, lineOptions(practiceLine));
      sel.addEventListener("change", () => { practiceLine = Number(sel.value); practiceMsg.textContent = ""; drawPractice(); });

      const playMine = el("button", { type: "button", text: "내 녹음 듣기", disabled: !mine || rec.active });
      const saveBox = el("div");
      const saveBtn = el("button", { type: "button", text: mine && mine.saved ? "보관함에 저장됨" : "보관함에 저장", disabled: !mine || mine.saved || rec.active });

        if (ready) { player.pauseVideo(); playOnce = null; repeat = null; drawPlayStatus(); drawLyrics(); }
        recAudio.src = mine.url; recAudio.currentTime = 0;

      });
      fill(practicePanel,
        el("h3", { text: "따라 부르기" }),
        el("label", { for: "p-line", text: "줄 선택" }), sel,
        l ? el("p", { class: "p-line-text", lang: "vi", text: l.vietnamese }) : null,
        !seg ? el("p", { class: "need small", text: "이 줄은 싱크가 없어 [원곡 듣기]를 쓸 수 없습니다(자막 싱크 설정 필요). 녹음은 됩니다." }) : null,
        el("div", { class: "row-actions" }, [listen, recBtn, playMine, saveBtn]), recAudio, saveBox,
        el("p", { class: "small muted", text: "점수는 매기지 않습니다. 녹음은 한 번에 최대 30초이며, [보관함에 저장]을 누른 것만 서버의 '내 녹음'(본인만 볼 수 있음)에 남습니다." }),
        practiceMsg
      );
    }
    async function startRecording(lineNumber) {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === "undefined") {
        practiceMsg.textContent = "이 브라우저는 녹음을 지원하지 않습니다."; return;
      }
      recAudio.pause();
      if (ready) { player.pauseVideo(); playOnce = null; drawPlayStatus(); }
      try { rec.stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
      catch (e) {
        const hint = { NotAllowedError: "마이크 권한이 거부되었습니다. 브라우저 설정에서 허용해 주세요.", NotFoundError: "마이크를 찾을 수 없습니다.", NotReadableError: "다른 앱이 마이크를 쓰고 있습니다." }[e.name];
        practiceMsg.textContent = "녹음을 시작하지 못했습니다: " + (hint || e.name + " — " + e.message);
        return;
      }
      try {
        const mime = pickMime();
        rec.recorder = mime ? new MediaRecorder(rec.stream, { mimeType: mime }) : new MediaRecorder(rec.stream);
      } catch (e) {

        const blob = new Blob(rec.chunks, { type: rec.recorder.mimeType || "audio/webm" });
        rec.active = false;
        if (blob.size) {
          const old = recordings.get(lineNumber);
          if (old) URL.revokeObjectURL(old.url);
          recordings.set(lineNumber, { url: URL.createObjectURL(blob), type: blob.type, blob: blob, saved: false });
          practiceMsg.textContent = lineNumber + "번 줄 녹음을 마쳤습니다. [내 녹음 듣기]를 누르세요.";
        } else practiceMsg.textContent = "녹음된 소리가 없습니다. 다시 녹음해 주세요.";
        drawPractice();
      };
      rec.recorder.start();
      rec.active = true;
      rec.timer = setTimeout(stopRecording, 30000); // 한 개 최대 30초

    function stopRecording() { clearTimeout(rec.timer); if (rec.recorder && rec.recorder.state === "recording") rec.recorder.stop(); }
    // 보관함 저장: 상한(설정값)을 넘으면 가장 오래된 녹음을 지울지 먼저 묻는다
    async function saveRecording(lineNumber, box, btn) {

      btn.disabled = true;
      try {
        await Settings.load(); // 관리자가 바꾼 보관 상한을 저장 직전에 다시 읽는다
        const list = await Server.myRecordings(), limit = Settings.get().recordingLimit || 20;
        const doSave = async () => {

          mine.saved = true; practiceMsg.textContent = "보관함에 저장했습니다. 아래 '이 곡 보관함'과 [녹음 보관함]에서 다시 듣고, [과제 제출]에서 그대로 제출할 수 있습니다."; if (singMiniDraw) singMiniDraw(); box.replaceChildren(); drawPractice();
        };

          const no = el("button", { type: "button", text: "취소" });
          yes.addEventListener("click", async () => { yes.disabled = true; try { await Server.deleteRecording(old); await doSave(); } catch (e) { practiceMsg.textContent = "저장하지 못했습니다: " + e.message; yes.disabled = false; } });
          no.addEventListener("click", () => { box.replaceChildren(); btn.disabled = false; });
